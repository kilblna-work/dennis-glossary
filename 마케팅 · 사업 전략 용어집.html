서비스 기획 · 마케팅 · 수익화 · 정산 · 사업 보고 과정에서 사용하는 마케팅 및 사업 전략 표준 용어 정리.

- 모든 용어는 **업계 표준 명칭**만 사용한다. 프로젝트 내부에서 임의로 만든 축약어는 쓰지 않는다.
- 약어는 최초 등장 시 **정식 명칭(Full form)** 을 함께 표기한다.
- 지표는 **정의 · 산식 · 집계 단위**를 함께 기록한다. 업계 표준이 없거나 회사마다 다르게 쓰는 지표(예: Net Revenue, Retention 방식)는 **계약서 또는 대시보드의 정의가 우선**하며, 이 문서는 통상적 의미를 설명한다.
- 사례는 **숏폼 동영상 · 모바일 앱 서비스 기준**으로 기술한다.
- 문서 내 상호 참조는 `→ 용어명` 으로 표기한다. 기술 용어는 `docs/network-glossary.md`를 참조한다.

---


## 1. 사업 전략 · 제품 전략

### Business Model (비즈니스 모델)
누구에게(고객) 어떤 가치를(가치 제안) 어떻게 전달하고(채널) 어떻게 돈을 버는지(수익 모델)를 정리한 구조. 숏폼 서비스의 대표 수익 모델은 광고(→ IAA), 인앱 결제(→ IAP), 크리에이터 후원 수수료(→ Take Rate), 커머스 연동이다.

### Business Model Canvas (비즈니스 모델 캔버스)
고객 세그먼트, 가치 제안, 채널, 고객 관계, 수익원, 핵심 자원, 핵심 활동, 핵심 파트너, 비용 구조 9개 블록으로 사업을 한 장에 정리하는 도구.

### Value Proposition (가치 제안)
고객이 왜 우리 서비스를 써야 하는지에 대한 핵심 약속. "어떤 문제를, 누구에게, 경쟁 대안보다 어떻게 더 잘 해결하는가"로 서술한다.

### MVP (Minimum Viable Product, 최소 기능 제품)
핵심 가설을 검증할 수 있는 **최소한의 기능만 담은 출시 가능한 제품**. 목적은 "빨리 만들기"가 아니라 "가장 적은 비용으로 학습하기"다.

> 실무 포인트: MVP는 **완성도가 낮은 제품**이 아니라 **범위가 좁은 제품**이다. 핵심 경험(숏폼이라면 "피드에서 영상을 넘겨 보는 경험")은 완성도가 높아야 하고, 부가 기능(프로필 꾸미기, 다국어 등)을 뺀다. → PoC, Prototype과의 차이는 부록 B 참조.

### PoC (Proof of Concept, 개념 검증)
기술적 · 사업적으로 **실현 가능한지**만 확인하는 검증 작업. 사용자에게 공개하지 않는 경우가 많다.

### Prototype (프로토타입)
UX와 동작 흐름을 확인하기 위한 시안. 실제 서비스 코드가 아닐 수 있다.

### PMF (Product-Market Fit, 제품-시장 적합성)
제품이 시장의 강한 수요를 충족하고 있는 상태. 리텐션 곡선이 0으로 떨어지지 않고 **평평해지는(Flattening) 지점**이 생기는 것이 대표 신호다. → Retention Curve

### Lean Startup (린 스타트업)
**만들기 → 측정 → 학습(Build-Measure-Learn)** 루프를 짧게 반복해 불확실성을 줄이는 방법론. MVP, 피벗 개념의 출처다.

### Pivot (피벗)
검증 결과를 바탕으로 전략의 핵심 요소(고객, 문제, 채널, 수익 모델 등)를 바꾸는 것. 기능 추가 · 개선은 피벗이 아니다.

### Roadmap (로드맵)
제품 · 사업의 방향과 주요 마일스톤을 시간 축으로 정리한 계획. 기능 목록이 아니라 **달성하려는 성과(Outcome)** 중심으로 쓰는 것이 권장된다.

### Milestone (마일스톤)
로드맵의 주요 중간 지점. 일정보다 **달성 조건**을 명확히 정의한다(예: "D7 리텐션 20% 달성").

### GTM (Go-to-Market Strategy, 시장 진입 전략)
제품을 어떤 시장에, 어떤 고객에게, 어떤 채널과 메시지로 출시할지 정리한 실행 계획. 출시 시점, 가격, 포지셔닝, 마케팅 채널 믹스를 포함한다.

### Positioning (포지셔닝)
경쟁 대안과 비교해 고객 인식 속에서 우리 제품이 차지할 위치를 정하는 것. "X를 위한 Y" 형태의 한 문장으로 정리한다.

### Differentiation (차별화)
경쟁 제품 대비 고객이 인지할 수 있는 고유한 우위. 기능 차별화는 모방이 쉬우므로 → Moat 관점에서 함께 검토한다.

### Moat (경제적 해자)
경쟁자가 쉽게 따라올 수 없는 구조적 진입 장벽. 네트워크 효과, 전환 비용, 브랜드, 규모의 경제, 독점 데이터·콘텐츠가 대표적이다.

### Network Effect (네트워크 효과)
사용자가 늘수록 서비스 가치가 커지는 현상. 숏폼에서는 크리에이터가 늘면 콘텐츠가 늘고, 시청자가 늘면 크리에이터가 유입되는 **양면 네트워크 효과**가 작동한다.

### Two-sided Market / Platform (양면 시장 · 플랫폼)
공급자(크리에이터, 광고주)와 수요자(시청자)를 연결해 가치를 만드는 사업 구조. 어느 한쪽이 먼저 모여야 하는 **닭과 달걀 문제(Chicken-and-Egg Problem)** 가 초기 핵심 과제다.

### Cold Start Problem (콜드 스타트 문제)
초기에 사용자·콘텐츠·데이터가 없어 서비스 가치와 추천 품질이 낮은 상태. 시딩 콘텐츠 확보, 초기 크리에이터 유치 계약, 인기순 기본 피드 등으로 대응한다. → 14장 추천 · 피드 운영

### Flywheel (플라이휠)
한 번 돌기 시작하면 스스로 가속되는 선순환 구조. 예: 콘텐츠 증가 → 시청 시간 증가 → 광고 수익 증가 → 크리에이터 보상 증가 → 콘텐츠 증가.

### Growth Loop (성장 루프)
한 사용자의 행동이 새로운 사용자를 만들어내는 순환 구조. 공유 → 외부 노출 → 신규 유입 → 공유. 일회성 퍼널보다 지속 가능한 성장 구조로 평가된다.

### Switching Cost (전환 비용) / Lock-in (락인)
사용자가 다른 서비스로 옮길 때 감수해야 하는 비용(팔로워, 업로드 이력, 학습된 추천). 전환 비용이 높으면 사용자가 묶여 있는 락인 상태가 된다.

### Winner-take-all / Winner-take-most (승자 독식)
네트워크 효과가 강한 시장에서 1~2위가 시장 대부분을 차지하는 구조. 후발 진입 시 니치 시장(→ Long Tail) 공략이 대안이다.

### First-mover Advantage / Fast Follower (선점 효과 / 빠른 추격자)
시장에 먼저 진입해 얻는 이점과, 선도자의 검증된 모델을 빠르게 개선해 따라가는 전략.

### Blue Ocean / Red Ocean (블루오션 / 레드오션)
- **Blue Ocean**: 경쟁이 없는 새로운 시장 공간을 창출하는 전략.
- **Red Ocean**: 기존 시장에서 점유율을 두고 경쟁하는 상태.

### Long Tail (롱테일)
판매량 분포 그래프에서 소수의 히트 상품(머리, Head)이 아닌 **다수의 소량 판매 상품(꼬리, Tail)** 의 합이 큰 비중을 차지하는 현상. Chris Anderson이 2004년 제시했다. 디지털 서비스는 재고 · 진열 비용이 거의 없어 롱테일 상품을 무한히 제공할 수 있다.

> 실무 포인트: 숏폼 서비스에서 롱테일은 **개인화 추천이 만들어내는 가치**다. 소수 인기 영상만 노출하면 헤드에 집중되고, 개인화가 잘 될수록 롱테일 콘텐츠가 소비되어 크리에이터 층이 넓어진다. 검색 마케팅에서는 → Long-tail Keyword 의미로도 쓴다.

### Short Tail / Head (숏테일 · 헤드)
분포의 머리 부분. 소수의 히트 콘텐츠, 대형 크리에이터, 검색량이 많은 대표 키워드를 가리킨다. 트래픽은 크지만 경쟁이 치열하고 의존도가 높아지면 리스크가 된다.

### Long-tail Keyword / Short-tail Keyword (롱테일 키워드 / 숏테일 키워드)
- **Short-tail Keyword**: 1~2 단어의 광범위한 키워드(예: "숏폼"). 검색량 많고 경쟁 심하며 전환율 낮음.
- **Long-tail Keyword**: 3 단어 이상의 구체적 키워드(예: "요리 숏폼 앱 추천"). 검색량은 적지만 의도가 명확해 전환율이 높다. → SEO, ASO

### Pareto Principle (파레토 법칙, 80/20 법칙)
상위 20%가 전체 성과의 80%를 만든다는 경험 법칙. 매출의 대부분을 소수 고결제 사용자(→ Whale)가 만드는 구조를 설명할 때 자주 쓰인다. 롱테일과 반대 방향의 관찰이다.

### Benchmarking (벤치마킹)
경쟁사 · 선도 서비스의 지표, 기능, 전략을 기준점으로 비교 분석하는 것.

### Competitive Analysis (경쟁 분석)
직접 경쟁자(같은 카테고리), 간접 경쟁자(같은 시간을 두고 경쟁, 예: 게임 · OTT), 대체재를 구분해 분석한다. 숏폼의 실제 경쟁 자원은 **사용자의 시간(Time Share)** 이다.

### Vertical / Horizontal (버티컬 / 호리즌탈)
- **Vertical**: 특정 주제 · 산업에 집중한 서비스(예: 요리 전용 숏폼).
- **Horizontal**: 모든 주제를 다루는 범용 서비스.

### Niche Market (니치 마켓, 틈새시장)
대형 사업자가 충분히 공략하지 않은 소규모 특화 시장. 롱테일 전략과 연결된다.

## 2. 시장 분석 프레임워크

### TAM / SAM / SOM (시장 규모 3단계)
- **TAM (Total Addressable Market, 전체 시장)**: 이론상 도달 가능한 전체 시장 규모.
- **SAM (Serviceable Available Market, 유효 시장)**: 우리 제품 · 채널 · 지역으로 실제 서비스 가능한 부분.
- **SOM (Serviceable Obtainable Market, 수익 시장)**: 현실적으로 단기 확보 가능한 점유 목표.

> 실무 포인트: 투자 · 사업 보고에서 TAM만 크게 제시하면 신뢰를 잃는다. **SOM을 어떤 근거(경쟁사 점유율, 마케팅 예산, 채널 도달)로 산출했는지**가 핵심이다.

### Market Share (시장 점유율)
전체 시장 매출 또는 사용자 중 우리가 차지하는 비율. 숏폼에서는 → Time Share(사용 시간 점유율)가 더 중요한 경쟁 지표로 쓰인다.

### Time Share / Share of Attention (시간 점유율)
사용자의 하루 미디어 소비 시간 중 우리 서비스가 차지하는 비율.

### SWOT Analysis (SWOT 분석)
내부 요인(Strengths 강점, Weaknesses 약점)과 외부 요인(Opportunities 기회, Threats 위협)을 4분면으로 정리하는 분석 도구.

### 3C Analysis (3C 분석)
Customer(고객), Competitor(경쟁사), Company(자사) 세 관점에서 전략을 도출하는 프레임워크.

### 4P (마케팅 믹스)
Product(제품), Price(가격), Place(유통 · 채널), Promotion(판촉). 디지털 서비스는 Place가 앱스토어 · 웹 · 파트너 채널에 해당한다. 서비스업 확장판으로 People, Process, Physical Evidence를 더한 **7P**가 있다.

### STP (Segmentation · Targeting · Positioning)
시장을 세분화(Segmentation)하고, 공략할 세그먼트를 선택(Targeting)한 뒤, 그 세그먼트 인식 속에서 위치를 정하는(Positioning) 마케팅 전략 수립 순서.

### PEST / PESTEL Analysis (거시 환경 분석)
Political(정치), Economic(경제), Social(사회), Technological(기술), 확장판은 Environmental(환경), Legal(법률)을 더한다. 개인정보 규제(→ 7장) 변화가 대표적인 Legal 요인이다.

### Porter's Five Forces (5 Forces, 산업 구조 분석)
기존 경쟁자, 신규 진입자 위협, 대체재 위협, 공급자 교섭력, 구매자 교섭력 5개 힘으로 산업의 수익성을 분석한다. 숏폼에서 공급자는 크리에이터, 구매자는 광고주로 해석할 수 있다.

### BCG Matrix (BCG 매트릭스)
시장 성장률과 상대 점유율로 사업 · 제품을 Star, Cash Cow, Question Mark, Dog 4분면에 배치하는 포트폴리오 분석 도구.

### Technology Adoption Lifecycle (기술 수용 주기)
신제품이 시장에 확산되는 순서. Innovators(2.5%) → Early Adopters(13.5%) → Early Majority(34%) → Late Majority(34%) → Laggards(16%).

### Chasm (캐즘)
Early Adopters와 Early Majority 사이에 존재하는 수요 단절 구간. Geoffrey Moore가 제시했다. 초기 열광 사용자의 반응을 대중 시장 수요로 오해하면 캐즘에서 성장이 멈춘다.

### Persona (페르소나)
핵심 타깃 고객을 대표하는 가상의 인물 프로필. 인구 통계뿐 아니라 **동기, 목표, 사용 맥락, 불편(Pain Point)** 을 포함해야 실무에 쓸 수 있다.

### Customer Journey Map (고객 여정 지도)
인지 → 탐색 → 설치 → 첫 사용 → 습관화 → 결제 → 추천 → 이탈까지 고객이 겪는 단계와 접점(→ Touchpoint), 감정, 불편을 시각화한 문서.

### Touchpoint (접점)
고객이 브랜드 · 서비스와 만나는 모든 지점. 광고, 스토어 페이지, 온보딩, 푸시, 고객센터, SNS 등.

### Pain Point (불편 지점)
고객이 현재 겪고 있는 문제 · 불만. 가치 제안은 페인 포인트 해결로 서술한다.

### JTBD (Jobs To Be Done, 해결 과제 이론)
고객은 제품을 "구매"하는 것이 아니라 어떤 "과제"를 해결하기 위해 "고용"한다는 관점. 숏폼의 과제는 "짧은 대기 시간을 지루하지 않게 채우기"처럼 정의된다.

## 3. 목표 관리와 지표 체계

### KPI (Key Performance Indicator, 핵심 성과 지표)
전략 목표 달성 여부를 측정하기 위해 선정한 **소수의 핵심 정량 지표**. 모든 측정값이 KPI가 아니며, 의사결정에 직접 영향을 주는 것만 KPI로 지정한다.

> 실무 포인트: 좋은 KPI는 **정의 · 산식 · 집계 주기 · 데이터 소스 · 책임자**가 문서화되어 있어야 한다. 같은 이름의 지표가 팀마다 다른 산식으로 집계되는 것이 대시보드 불신의 가장 흔한 원인이다.

### OKR (Objectives and Key Results, 목표와 핵심 결과)
정성적 목표(Objective) 하나에 그 달성을 판단할 정량 결과(Key Results) 2~5개를 붙이는 목표 관리 체계. Intel의 Andy Grove가 만들고 John Doerr가 확산시켰다. KPI는 상시 모니터링 지표, OKR은 분기 단위 도전 목표라는 차이가 있다.

### North Star Metric (북극성 지표)
제품이 고객에게 전달하는 핵심 가치를 가장 잘 대표하는 **단일 지표**. 숏폼 서비스는 "일간 총 시청 시간" 또는 "주간 활성 시청자 수"를 흔히 사용한다. 매출은 결과 지표이므로 북극성 지표로는 잘 쓰지 않는다.

### Input Metric / Output Metric (투입 지표 / 산출 지표)
- **Input Metric**: 팀이 직접 통제할 수 있는 행동 지표(업로드 수, 푸시 발송 수, 광고 예산).
- **Output Metric**: 그 결과로 나타나는 성과 지표(DAU, 매출). 목표는 Output으로, 실행 관리는 Input으로 한다.

### Leading Indicator / Lagging Indicator (선행 지표 / 후행 지표)
- **Leading**: 미래 성과를 미리 알려주는 지표(D1 리텐션, 활성화율).
- **Lagging**: 결과가 확정된 후에 나타나는 지표(월 매출, D90 리텐션).

### Guardrail Metric (가드레일 지표)
목표 지표를 올리면서 **훼손되어서는 안 되는 지표**. 광고 노출을 늘려 매출을 올릴 때 리텐션과 세션 길이를 가드레일로 둔다.

### Vanity Metric (허영 지표)
숫자는 크지만 의사결정에 도움이 되지 않는 지표. 누적 다운로드 수, 누적 가입자 수, 페이지뷰가 대표적이다. → Actionable Metric

### Actionable Metric (실행 가능 지표)
원인과 결과가 연결되어 다음 행동을 결정할 수 있는 지표. 코호트별 리텐션, 채널별 CAC 등.

### Ratio Metric / Absolute Metric (비율 지표 / 절대 지표)
비율 지표(리텐션율, 전환율)는 규모 변화에 영향을 덜 받아 비교에 적합하고, 절대 지표(DAU, 매출)는 사업 규모를 나타낸다. 둘을 함께 봐야 한다.

### Benchmark (벤치마크, 기준치)
업계 평균 또는 경쟁사 수준의 지표 값. 장르 · 국가 · 획득 채널에 따라 편차가 크므로 외부 벤치마크는 참고치로만 쓰고, **자사 과거 코호트**를 1차 기준으로 삼는다.

### Dashboard (대시보드)
KPI를 정해진 주기로 시각화해 보여주는 화면. 일간 운영 대시보드와 경영 보고 대시보드는 지표 수준이 달라야 한다.

### Metric Tree / KPI Tree (지표 트리)
북극성 지표를 하위 구성 지표로 분해한 나무 구조. 예: 총 시청 시간 = DAU × 1인당 세션 수 × 세션당 시청 시간.

## 4. 사용자 규모 지표 (AU 계열)

### AU (Active User, 활성 사용자)
특정 기간 동안 **정의된 활성 행동**을 1회 이상 수행한 고유(Unique) 사용자. "활성"의 정의(앱 실행? 영상 1개 이상 시청? 로그인?)를 반드시 문서화한다. 기간에 따라 → DAU, WAU, MAU로 나뉜다.

> 실무 포인트: AU 집계 단위가 **기기(Device)인지 계정(Account)인지** 확정해야 한다. 비로그인 시청을 허용하는 숏폼 서비스는 기기 기준 AU가 계정 기준보다 크게 나온다. 또한 타임존(UTC 기준인지 KST 기준인지)이 다르면 일간 수치가 달라진다.

### DAU (Daily Active Users, 일간 활성 사용자)
하루 동안의 활성 고유 사용자 수. 서비스 규모와 일상 습관화 정도를 나타내는 가장 기본적인 지표.

### WAU (Weekly Active Users, 주간 활성 사용자)
7일 동안의 활성 고유 사용자 수. 주말 · 주중 편차를 평탄화해 볼 때 사용한다.

### MAU (Monthly Active Users, 월간 활성 사용자)
30일(또는 해당 월) 동안의 활성 고유 사용자 수. 광고주 · 투자자에게 서비스 규모를 설명하는 대표 지표.

### Stickiness (고착도, DAU/MAU Ratio)
`DAU ÷ MAU`. 월간 사용자 중 매일 접속하는 비율. 20%면 사용자가 월 평균 6일 접속한다는 의미다. 소셜 · 숏폼 서비스는 50% 이상이면 매우 높은 습관성으로 평가된다.

### NRU (New Registered Users, 신규 가입자)
특정 기간 동안 새로 가입(또는 최초 실행)한 사용자 수. 게임 업계에서 관용적으로 쓰는 약어이며, 일반적으로는 New Users로 표기한다.

### New User / Returning User / Resurrected User (신규 / 재방문 / 복귀 사용자)
- **New User**: 해당 기간에 처음 활성화된 사용자.
- **Returning User**: 이전 기간에도 활성이었던 사용자.
- **Resurrected User (Reactivated User)**: 이탈 상태(예: 30일 이상 미접속)였다가 다시 활성화된 사용자.

DAU는 세 집단의 합으로 분해해 성장 원인을 진단한다.

### Install / Download / Registration / Activation (설치 / 다운로드 / 가입 / 활성화)
스토어 다운로드 → 기기 설치 → 최초 실행(Open) → 가입 → 활성화(핵심 행동 수행)로 이어지는 단계. 각 단계 사이에 이탈이 있으므로 **어느 단계를 "유저 1명"으로 셀지** 채널별 비교 시 통일한다.

### CCU (Concurrent Users, 동시 접속자) / PCU (Peak Concurrent Users, 최대 동시 접속자)
같은 시점에 접속 중인 사용자 수와 그 하루 최대치. 서버 용량 계획과 라이브 이벤트 성과 측정에 쓴다. 게임 업계에서는 MCU(Maximum Concurrent Users)라고도 한다.

### Cumulative Users / Total Registered Users (누적 사용자 · 누적 가입자)
서비스 시작 이후 전체 가입자 수. 이탈자가 포함되어 있어 → Vanity Metric에 해당하며, 대외 홍보에는 쓰이지만 운영 지표로는 쓰지 않는다.

### Cohort (코호트)
같은 시기 또는 같은 조건(가입 주, 획득 채널, 국가)으로 묶은 사용자 집단. 리텐션과 LTV는 반드시 코호트 단위로 본다.

### Segment (세그먼트)
행동 · 속성 기준으로 나눈 사용자 집단(고결제 사용자, 크리에이터, 비로그인 시청자). 코호트는 시간 축 기준, 세그먼트는 속성 기준이라는 차이가 있다.

### Session (세션)
사용자가 앱을 열어 사용하다 종료하기까지의 한 번의 이용 단위. 일반적으로 **30분 이상 비활동**이면 새 세션으로 집계하지만, 툴(Firebase, Amplitude 등)마다 기준이 다르다.

### Session Length / Session Frequency (세션 길이 / 세션 빈도)
세션 1회 평균 지속 시간과 사용자 1인당 하루 세션 수. 숏폼은 짧고 잦은 세션 패턴이 특징이다.

### Time Spent / Total Watch Time (총 사용 시간 · 총 시청 시간)
전체 사용자의 시청 시간 합계. 광고 인벤토리(→ Impression) 규모를 결정하므로 숏폼 서비스의 대표 → North Star Metric 후보다.

### Engagement (참여도)
사용자가 서비스와 상호작용하는 정도. 시청 완료, 좋아요, 댓글, 공유, 팔로우, 업로드 등 행동을 가중 합산해 지표화한다. → Engagement Rate

## 5. 사용자 획득 (UA · 퍼포먼스 마케팅)

### UA (User Acquisition, 사용자 획득)
광고 · 제휴 · 바이럴 등으로 신규 사용자를 확보하는 활동 전반. 모바일 앱 업계에서는 주로 **유료 광고 기반 획득**을 뜻한다.

### Performance Marketing (퍼포먼스 마케팅)
설치 · 전환 등 측정 가능한 성과를 기준으로 비용을 집행하고 최적화하는 마케팅. → Brand Marketing과 대비된다.

### Organic / Paid (자연 유입 / 유료 유입)
- **Organic**: 광고비 없이 검색, 추천, 입소문, 스토어 노출로 들어온 사용자.
- **Paid**: 광고 클릭 등 유료 캠페인에 기인(→ Attribution)한 사용자.

### Organic Uplift / Organic Multiplier (오가닉 상승 효과)
유료 광고 집행 시 브랜드 노출 증가로 함께 늘어나는 자연 유입. `총 설치 ÷ 유료 설치` 로 배수를 계산해 실질 CPI를 보정한다.

### Impression (노출)
광고 또는 콘텐츠가 화면에 표시된 횟수. 표시 기준(→ Viewability)에 따라 수치가 달라진다.

### Reach (도달)
광고를 1회 이상 본 **고유 사용자 수**. Impression은 중복을 포함하고 Reach는 중복을 제거한다.

### Frequency (빈도)
사용자 1명이 같은 광고를 본 평균 횟수. `Impression ÷ Reach`. 과도하면 → Ad Fatigue가 발생하므로 → Frequency Cap을 둔다.

### Click / CTR (Click-Through Rate, 클릭률)
`클릭 수 ÷ 노출 수 × 100`. 크리에이티브의 주목도를 나타낸다.

### CVR (Conversion Rate, 전환율)
`전환 수 ÷ 클릭 수(또는 방문 수) × 100`. 전환의 정의(설치, 가입, 결제)를 명시해야 한다. 스토어 페이지 전환율은 → ASO의 핵심 지표다.

### Conversion (전환)
마케팅 목표로 정의한 행동의 완료. 설치, 가입, 첫 시청, 첫 결제, 구독 시작 등 단계별로 정의한다.

### CPM (Cost Per Mille, 1,000회 노출당 비용)
`광고비 ÷ 노출 수 × 1,000`. 브랜드 캠페인의 매입 단가 기준. 매체 판매자 입장에서는 → eCPM으로 표현한다.

### CPC (Cost Per Click, 클릭당 비용)
`광고비 ÷ 클릭 수`.

### CPI (Cost Per Install, 설치당 비용)
`광고비 ÷ 설치 수`. 모바일 앱 UA의 기본 단가 지표. 국가 · OS · 장르별 편차가 매우 크다.

### CPA (Cost Per Action / Acquisition, 행동당 비용)
`광고비 ÷ 전환 수`. 설치 이후의 특정 행동(가입, 첫 결제 등)을 기준으로 한다. 설치보다 품질을 반영하므로 CPI보다 진화된 매입 방식이다.

### CPE (Cost Per Engagement, 참여당 비용)
좋아요 · 공유 · 영상 시청 완료 등 참여 행동 1건당 비용.

### CPV (Cost Per View, 조회당 비용)
동영상 광고 1회 조회당 비용. "조회"의 정의(3초? 6초? 완료?)가 매체마다 다르다.

### tCPA / tROAS (Target CPA / Target ROAS, 목표 단가 입찰)
광고 플랫폼에 목표 CPA 또는 ROAS를 지정하면 알고리즘이 입찰을 자동 조정하는 입찰 방식.

### Bid / Bidding (입찰)
광고 노출 기회에 대해 광고주가 지불 의사 금액을 제시하는 것. 경매(Auction) 방식으로 낙찰된다.

### Campaign / Ad Set / Ad (캠페인 / 광고 세트 / 광고)
광고 플랫폼의 3단계 구조. 캠페인(목표 · 예산) → 광고 세트(타겟 · 입찰 · 노출 위치) → 광고(크리에이티브).

### Creative (크리에이티브, 소재)
광고 이미지 · 영상 · 문구 자체. 숏폼 UA는 세로형 15~30초 영상 소재가 성과를 좌우한다.

### Ad Fatigue / Creative Fatigue (소재 피로도)
같은 소재가 반복 노출되어 CTR과 CVR이 떨어지는 현상. 소재 교체 주기(Creative Refresh)를 운영한다.

### Frequency Cap (노출 빈도 제한)
사용자 1명에게 같은 광고를 일정 기간 N회 이상 노출하지 않도록 제한하는 설정.

### Targeting (타겟팅)
광고를 노출할 대상을 인구 통계, 관심사, 행동, 위치 등으로 지정하는 것.

### Retargeting / Remarketing (리타겟팅 / 리마케팅)
이미 앱을 설치했거나 방문했던 사용자에게 다시 광고를 노출해 복귀 · 전환을 유도하는 것. 이탈 사용자 대상 → Win-back 캠페인의 핵심 수단.

### Lookalike Audience (유사 타겟)
기존 우수 사용자(고결제자, 고리텐션 코호트)와 특성이 비슷한 사용자를 광고 플랫폼이 찾아 타겟팅하는 기능. 시드(Seed) 오디언스 품질이 성과를 결정한다.

### Custom Audience / Audience List (맞춤 타겟)
자사 데이터(설치자, 결제자, 이메일 해시)로 만든 타겟 목록. 제외 타겟(Exclusion)으로 기존 사용자에게 설치 광고가 나가지 않게 하는 데도 쓴다.

### Placement (노출 위치, 지면)
광고가 표시되는 위치. 피드, 스토리, 릴스, 검색 결과, 앱 내 보상형 등.

### Ad Network (광고 네트워크)
다수 매체의 광고 지면을 묶어 광고주에게 판매하는 중개 사업자. Google Ads, Meta, AppLovin, Unity Ads, ironSource 등. 서비스 입장에서는 **광고를 사는 곳(UA)** 이면서 **광고 지면을 파는 곳(→ IAA)** 이기도 하다.

### SAN (Self-Attributing Network, 자체 어트리뷰션 네트워크)
Google, Meta, Apple Search Ads, TikTok 등 자체적으로 전환을 판정해 → MMP에 통보하는 대형 광고 플랫폼.

### Media Mix / Channel Mix (미디어 믹스, 채널 믹스)
전체 마케팅 예산을 채널별로 배분한 구성. 성과 · 규모 · 리스크 분산을 고려해 정한다.

### MMM (Marketing Mix Modeling, 마케팅 믹스 모델링)
채널별 지출과 결과 지표의 관계를 통계적으로 추정해 예산 배분을 최적화하는 분석. 개인 식별 없이 집계 데이터만 쓰므로 → ATT 이후 중요도가 커졌다.

### Viral Marketing (바이럴 마케팅) / K-factor (바이럴 계수)
사용자가 다른 사용자를 데려오는 확산 효과. `K = 사용자 1인당 초대 수 × 초대 전환율`. K > 1이면 유료 획득 없이도 자가 성장한다. 숏폼에서는 **외부 공유 링크를 통한 유입**이 K-factor의 실체다.

### Referral Program (리퍼럴 프로그램, 친구 초대)
기존 사용자가 신규 사용자를 초대하면 양측에 보상을 주는 제도. 어뷰징(자기 초대, 다계정) 방지 설계가 필수다.

### Cross Promotion (크로스 프로모션)
자사의 다른 서비스 · 앱 사용자에게 무료 또는 저비용으로 광고해 유입시키는 것. 게임 퍼블리셔가 신작을 기존 게임 내에서 광고하는 방식이 대표적이다.

### Influencer Marketing (인플루언서 마케팅)
팔로워를 보유한 크리에이터에게 대가를 지급하고 홍보 콘텐츠를 제작 · 게시하게 하는 마케팅. 광고 표시(→ 광고 고지 의무)가 법적으로 요구된다.

### Seeding (시딩)
제품 · 콘텐츠를 초기 사용자, 인플루언서, 커뮤니티에 미리 배포해 입소문의 씨앗을 뿌리는 활동. 콜드 스타트 대응책이기도 하다.

### Affiliate Marketing (제휴 마케팅)
파트너가 자기 채널로 유입 · 전환을 만들면 성과에 따라 수수료를 지급하는 방식. 트래킹 링크로 성과를 귀속시킨다.

### Landing Page (랜딩 페이지)
광고 클릭 후 처음 도착하는 페이지. 앱은 스토어 페이지 또는 → Deep Link 목적지가 랜딩이다.

### Deep Link / Deferred Deep Link (딥링크 / 지연 딥링크)
- **Deep Link**: 앱의 특정 화면(특정 영상, 크리에이터 프로필)으로 바로 이동시키는 링크.
- **Deferred Deep Link**: 앱이 설치되어 있지 않으면 스토어로 보내고, **설치 후 첫 실행 시 원래 목적지로 이동**시키는 링크. 공유 링크 유입의 첫 경험을 결정하므로 숏폼 서비스에 필수다.

### Owned / Earned / Paid Media (자사 매체 / 획득 매체 / 유료 매체)
- **Owned**: 자사 소유 채널(공식 SNS, 블로그, 앱 내 공지, 푸시).
- **Earned**: 언론 보도, 사용자 후기, 입소문처럼 돈을 내지 않고 얻은 노출.
- **Paid**: 광고비를 지불한 노출.

## 6. 검색 · 스토어 최적화 (SEO · ASO)

### SEO (Search Engine Optimization, 검색 엔진 최적화)
검색 결과에서 자사 페이지가 상위에 노출되도록 콘텐츠 · 기술 구조 · 외부 링크를 개선하는 활동. 광고비 없이 지속적으로 유입을 만드는 → Organic 채널이다.

- **On-page SEO**: 제목, 메타 설명, 헤딩 구조, 본문 키워드, 내부 링크, 이미지 대체 텍스트.
- **Off-page SEO**: 외부 사이트에서 오는 링크(Backlink), 브랜드 언급.
- **Technical SEO**: 페이지 속도(Core Web Vitals), 모바일 대응, 크롤링 · 색인 가능성, 구조화 데이터(Schema.org), 사이트맵, `robots.txt`.

> 실무 포인트: 숏폼 서비스에서 SEO의 핵심은 **영상 공유 페이지(웹 랜딩)** 다. 앱 내부 콘텐츠는 검색 엔진에 노출되지 않으므로, 영상별 공개 웹 페이지에 제목 · 설명 · 썸네일 · `VideoObject` 구조화 데이터를 넣어 검색 유입 → 앱 설치로 이어지는 경로를 만든다.

### SEM (Search Engine Marketing, 검색 엔진 마케팅)
검색 결과에 유료 광고를 노출하는 것. 넓게는 SEO를 포함하지만 실무에서는 **검색 광고(Paid Search)** 를 뜻한다.

### SERP (Search Engine Results Page, 검색 결과 페이지)
검색 결과 화면. 광고, 자연 검색 결과, 동영상 · 이미지 블록, 지식 패널 등으로 구성된다.

### Keyword Research (키워드 조사)
사용자가 실제로 검색하는 단어와 검색량, 경쟁 강도를 조사하는 작업. → Long-tail Keyword, Short-tail Keyword

### Search Intent (검색 의도)
검색어 뒤에 있는 목적. 정보형(Informational), 탐색형(Navigational), 거래형(Transactional), 상업 조사형(Commercial Investigation)으로 구분한다.

### Backlink / Domain Authority (백링크 / 도메인 권위)
다른 사이트가 우리 페이지를 링크하는 것과, 그로 인해 형성되는 사이트 신뢰도 추정치. 권위는 검색 엔진 공식 지표가 아니라 SEO 도구의 추정 점수다.

### Core Web Vitals (핵심 웹 지표)
Google이 검색 순위 요소로 사용하는 사용자 경험 지표. LCP(Largest Contentful Paint, 로딩), INP(Interaction to Next Paint, 반응성), CLS(Cumulative Layout Shift, 시각 안정성).

### Crawling / Indexing (크롤링 / 색인)
검색 엔진이 페이지를 수집하는 것과 검색 가능 상태로 저장하는 것. 색인되지 않으면 아무리 좋은 페이지도 노출되지 않는다.

### Canonical URL (표준 URL)
같은 콘텐츠가 여러 URL로 접근될 때 검색 엔진에 대표 URL을 알려주는 태그. 공유 링크에 붙는 트래킹 파라미터로 URL이 분산되는 것을 막는다.

### Open Graph / Twitter Card (오픈 그래프)
링크를 SNS · 메신저에 공유할 때 표시되는 제목 · 설명 · 미리보기 이미지를 지정하는 메타 태그. 공유 유입 클릭률을 직접 좌우한다.

### ASO (App Store Optimization, 앱스토어 최적화)
앱스토어 검색 노출과 스토어 페이지 전환율을 높이는 활동. SEO의 앱스토어 버전이다.

- **메타데이터**: 앱 이름, 부제(Subtitle), 키워드 필드(App Store), 짧은 설명 · 긴 설명(Google Play).
- **크리에이티브**: 아이콘, 스크린샷, 프리뷰 영상.
- **평점 · 리뷰**: 별점과 리뷰 수 · 응답률.
- **스토어 전환율(Store CVR)**: 페이지 조회 → 설치 비율. 스크린샷 A/B 테스트(App Store의 Product Page Optimization, Google Play의 스토어 등록정보 실험)로 개선한다.

### Featuring (피처링)
스토어 운영사가 앱을 추천 영역에 노출해 주는 것. 단기간 대규모 자연 유입을 만들며, 플랫폼 신기능(예: 새 OS API) 채택이 선정 요인이 된다.

### Store Ranking / Category Ranking (스토어 순위 · 카테고리 순위)
다운로드 속도, 리텐션, 매출 등을 기반으로 스토어가 매기는 순위. 순위 진입은 다시 자연 유입을 만드는 순환 효과가 있다.

### Apple Search Ads (ASA)
App Store 검색 결과 상단 광고. 검색 의도가 명확해 CPI 대비 리텐션이 높은 채널로 분류된다.

### Custom Product Page (CPP) / Custom Store Listing (맞춤 스토어 페이지)
광고 캠페인 · 유입 경로별로 다른 스크린샷과 문구를 보여주는 스토어 페이지 변형. 소재와 스토어 페이지의 메시지를 일치시켜 전환율을 높인다.

## 7. 어트리뷰션과 개인정보 규제

### Attribution (어트리뷰션, 기여도 귀속)
설치 · 전환이 어떤 광고 · 채널 덕분에 발생했는지 판정하는 것. UA 성과 측정의 근간이다.

### MMP (Mobile Measurement Partner, 모바일 측정 파트너)
앱 설치와 인앱 이벤트를 수집해 광고 채널별로 어트리뷰션을 판정하는 제3자 솔루션. AppsFlyer, Adjust, Singular, Branch 등. 모든 광고 채널의 성과를 **하나의 기준으로 비교**하기 위해 필수적으로 도입한다.

### Attribution Model (어트리뷰션 모델)
- **Last Click (라스트 클릭)**: 전환 직전 마지막 클릭에 100% 귀속. 모바일 UA의 기본값.
- **First Click**: 최초 접점에 귀속.
- **Multi-touch (멀티 터치)**: 여러 접점에 가중 배분(선형, 시간 감쇠, U형 등).
- **View-through (뷰스루)**: 클릭 없이 노출만 있었던 경우 귀속. 과대 계상 위험이 있어 짧은 윈도우를 둔다.

### Attribution Window / Lookback Window (어트리뷰션 기간)
광고 접점 이후 며칠 안에 발생한 설치를 그 광고에 귀속시킬지 정한 기간. 클릭 7일, 노출 1일이 관례적 기본값이다. 채널 간 비교 시 윈도우를 통일해야 한다.

### Deterministic / Probabilistic Attribution (결정적 / 확률적 어트리뷰션)
- **Deterministic**: 광고 ID(→ IDFA, GAID) 일치로 확정 매칭.
- **Probabilistic**: IP, 기기 모델, OS 버전 등으로 확률적 추정. Apple은 ATT 미동의 사용자에게 이 방식(핑거프린팅)을 **정책상 금지**한다.

### Advertising ID (광고 식별자)
- **IDFA (Identifier for Advertisers)**: iOS 광고 식별자. iOS 14.5 이후 → ATT 동의 시에만 접근 가능.
- **GAID (Google Advertising ID, AAID)**: Android 광고 식별자. 사용자가 재설정 · 삭제할 수 있다.

### ATT (App Tracking Transparency, 앱 추적 투명성)
2021년 iOS 14.5에 도입된 정책. 앱이 IDFA에 접근하거나 다른 회사 데이터와 결합해 추적하려면 **사용자에게 팝업으로 명시적 동의**를 받아야 한다. 동의율(Opt-in Rate)이 낮아 iOS 어트리뷰션 정확도가 크게 떨어졌고, → SKAdNetwork와 → MMM의 중요도가 높아졌다.

### SKAdNetwork (SKAN) / AdAttributionKit (Apple 프라이버시 보존 어트리뷰션)
Apple이 제공하는 개인 식별 없는 집계 기반 어트리뷰션 프레임워크. 개별 사용자가 아닌 캠페인 단위 전환값(Conversion Value)만 지연 · 무작위화되어 전달된다. AdAttributionKit은 SKAN의 후속 프레임워크다.

### Privacy Sandbox (프라이버시 샌드박스)
Google이 제3자 쿠키와 GAID 의존을 줄이기 위해 웹 · Android에 도입을 추진하는 개인정보 보존 광고 기술 묶음. 어트리뷰션 보고 API 등을 포함한다.

### Consent Management / CMP (Consent Management Platform, 동의 관리 플랫폼)
개인정보 처리 · 광고 추적 동의를 수집 · 저장 · 전달하는 체계. 유럽 → GDPR 대응에 필요하며 Google은 특정 지역에서 인증된 CMP 사용을 요구한다.

### GDPR (General Data Protection Regulation, 유럽 일반 개인정보보호법)
EU 거주자의 개인정보 처리 규정. 명시적 동의, 삭제권, 데이터 이동권, 위반 시 매출의 최대 4% 과징금. EU 사용자가 한 명이라도 있으면 적용된다.

### CCPA / CPRA (California Consumer Privacy Act, 캘리포니아 소비자 개인정보보호법)
미국 캘리포니아 주법. 개인정보 판매 거부권(Do Not Sell)을 보장한다.

### COPPA (Children's Online Privacy Protection Act, 미국 아동 온라인 개인정보보호법)
13세 미만 아동의 개인정보 수집에 부모 동의를 요구하는 미국 연방법. 아동 대상으로 분류되면 개인화 광고가 제한된다. 숏폼 서비스는 **연령 확인(Age Gate)** 설계가 필수다.

### 개인정보 보호법 (PIPA, Personal Information Protection Act, 한국)
한국의 개인정보 처리 기본법. 수집 · 이용 동의, 목적 외 이용 금지, 국외 이전 고지, 유출 통지 의무를 규정한다. 만 14세 미만은 법정대리인 동의가 필요하다.

### 정보통신망법 (한국)
온라인 광고성 정보 전송(푸시 · 문자 · 이메일)의 **사전 수신 동의(Opt-in)** 와 야간(21시~08시) 광고 전송 제한을 규정한다. → Push Notification 운영 시 준수 대상.

### Opt-in / Opt-out (사전 동의 / 사후 거부)
- **Opt-in**: 사용자가 명시적으로 동의해야 처리 가능(ATT, 한국 광고성 정보).
- **Opt-out**: 기본 허용하되 사용자가 거부할 수 있음(CCPA의 판매 거부).

### First-party Data / Third-party Data (1차 데이터 / 3자 데이터)
- **First-party**: 자사 서비스에서 직접 수집한 사용자 데이터. 규제 강화 이후 가치가 커졌다.
- **Third-party**: 외부 데이터 사업자에게서 구매한 데이터. 규제로 활용이 급격히 줄고 있다.

### Data Clean Room (데이터 클린룸)
서로의 원본 데이터를 노출하지 않고 집계 수준에서만 결합 분석할 수 있게 하는 보안 환경. 광고 플랫폼과 광고주의 성과 분석에 쓰인다.

## 8. 활성화 · 리텐션 · 이탈

### AARRR (Pirate Metrics, 해적 지표)
Dave McClure가 제시한 성장 퍼널 5단계. **Acquisition(획득) → Activation(활성화) → Retention(유지) → Revenue(수익) → Referral(추천)**. 각 단계마다 대표 지표를 두고 병목 단계를 찾는다. → 부록 C

### Funnel (퍼널)
사용자가 목표 행동에 이르기까지 거치는 단계와 단계별 이탈을 깔때기 모양으로 표현한 분석. 단계 정의와 순서를 명확히 해야 한다.

### Onboarding (온보딩)
신규 사용자가 서비스 가치를 처음 경험하기까지의 초기 흐름. 가입 절차, 관심사 선택, 첫 피드 노출까지를 포함한다. 숏폼은 **가입 없이 즉시 시청**을 허용해 온보딩 마찰을 최소화하는 것이 일반적이다.

### Activation (활성화)
신규 사용자가 서비스의 핵심 가치를 처음으로 경험한 상태. 활성화 기준(예: "첫 세션에 영상 5개 이상 시청")을 정의하고, 이 기준을 충족한 코호트의 리텐션이 유의하게 높은지로 검증한다.

### Aha Moment (아하 모먼트)
사용자가 서비스의 가치를 체감하는 결정적 순간. 활성화 기준은 아하 모먼트를 데이터로 정의한 것이다.

### TTV (Time to Value, 가치 도달 시간)
설치 후 아하 모먼트까지 걸리는 시간. 짧을수록 초기 리텐션이 높다.

### Retention (리텐션, 유지율)
특정 시점에 유입된 사용자 중 일정 기간 뒤에도 활성 상태인 비율. 제품 품질과 → PMF를 판단하는 가장 중요한 지표다.

```
Day N Retention = (설치일 기준 N일째에 활성인 사용자 수) ÷ (설치일 코호트 사용자 수) × 100
```

관례적으로 **D1, D3, D7, D14, D30, D60, D90**을 본다. D0는 설치 당일이다.

### Retention 산정 방식 (Classic · Rolling · Range)
- **Classic Retention (N-day Retention, 정확 일자)**: N일째 **당일**에 활성이었던 사용자 비율. 가장 보수적이고 업계 표준.
- **Rolling Retention (Unbounded Retention)**: N일째 **또는 그 이후에** 한 번이라도 활성이었던 사용자 비율. 수치가 크게 나오며 시간이 지나면 과거 값이 바뀐다.
- **Range Retention (Bracket Retention, 구간)**: 특정 구간(예: 8~14일) 중 한 번이라도 활성이었던 비율. 주간 · 월간 리텐션에 사용한다.

> 실무 포인트: 방식이 다르면 같은 서비스도 D7 리텐션이 15%와 40%로 갈라진다. 대시보드 · 보고서 · 계약서에 **어떤 방식인지 반드시 명기**한다. 외부 벤치마크를 인용할 때도 방식을 확인한다.

### Retention Curve (리텐션 곡선)
경과 일수에 따른 리텐션을 그린 곡선. 초기 급락 후 **0으로 수렴하지 않고 일정 수준에서 평탄해지면** 핵심 사용자층이 형성된 것으로 본다(→ PMF). 계속 하락하면 리텐션 문제가 있다.

### Churn (이탈, 이탈률)
일정 기간 동안 서비스 사용을 중단한 사용자의 비율. `Churn Rate = 1 − Retention Rate` 관계지만, 이탈 판정 기준(며칠 미접속이면 이탈인지)을 정의해야 한다. 구독 서비스에서는 구독 해지율을 뜻한다.

### Churn 판정 기준 (Inactivity Threshold)
"마지막 접속 후 N일 이상 미접속"을 이탈로 보는 기준. 숏폼처럼 일간 사용 서비스는 7~14일, 월간 사용 서비스는 30~60일을 쓴다. 기준은 재방문 확률이 급격히 떨어지는 지점을 데이터로 찾아 정한다.

### Dormant User (휴면 사용자)
이탈 기준을 넘긴 사용자. 한국 개인정보 보호법상 장기 미이용자 개인정보 처리(파기 또는 분리 보관) 정책과 연결된다.

### Win-back / Reactivation Campaign (복귀 유도 캠페인)
이탈 사용자를 푸시, 이메일, → Retargeting 광고로 다시 불러오는 활동. 복귀 사용자는 → Resurrected User로 집계한다.

### Lifecycle Stage (사용자 생애 단계)
신규 → 활성화 → 참여(Engaged) → 핵심(Power User) → 위험(At-risk) → 이탈 → 복귀의 단계 구분. 단계별로 다른 CRM 메시지를 보낸다.

### Power User / Core User (파워 유저 · 핵심 사용자)
사용 빈도와 참여도가 매우 높은 상위 사용자군. 파워 유저 곡선(월 30일 중 활성 일수 분포)으로 규모를 진단한다.

### Engagement Rate (참여율)
콘텐츠 또는 계정 단위로 참여 행동 비율을 나타낸 지표.

```
콘텐츠 참여율 = (좋아요 + 댓글 + 공유 + 저장) ÷ 조회수 × 100
계정 참여율  = (좋아요 + 댓글 + 공유) ÷ 팔로워 수 × 100
```

분모가 조회수인지 팔로워 수인지 반드시 명시한다.

### Habit Loop (습관 루프)
계기(Trigger) → 행동(Action) → 보상(Reward) → 투자(Investment) 순환으로 사용 습관이 형성되는 구조. 푸시 알림은 외부 계기, 무한 피드의 가변 보상은 보상에 해당한다.

### Feature Adoption (기능 채택률)
특정 기능을 사용한 활성 사용자의 비율. 신규 기능 성과 판단에 쓴다.

### NPS (Net Promoter Score, 순추천 지수)
"이 서비스를 지인에게 추천할 의향이 있습니까?"를 0~10점으로 물어, 추천 고객(9~10) 비율에서 비추천 고객(0~6) 비율을 뺀 값. −100~+100 범위. Fred Reichheld가 제시했다.

### CSAT (Customer Satisfaction Score, 고객 만족도)
특정 경험(고객센터 응대, 기능 사용)에 대한 만족도를 5점 또는 7점 척도로 묻는 지표. NPS가 관계 전반, CSAT는 개별 접점을 측정한다.

### CES (Customer Effort Score, 고객 노력 지수)
문제 해결이나 과제 완료에 얼마나 노력이 들었는지 묻는 지표. 낮을수록 좋다.

## 9. 수익화 모델과 수익 지표

### Monetization (수익화)
서비스 사용을 매출로 전환하는 활동과 그 설계. 모바일 서비스의 3대 모델은 → IAP, → IAA, → Subscription이다.

### IAP (In-App Purchase, 인앱 결제)
앱 안에서 디지털 상품(코인, 아이템, 기프트, 광고 제거 등)을 구매하는 것. 스토어 결제 시스템을 거치면 → Platform Fee가 발생한다.

### IAA (In-App Advertising, 인앱 광고)
앱 안에 광고 지면을 두고 광고 노출로 매출을 얻는 모델. 숏폼 서비스의 주 수익원이며 → 12장 Ad Tech 참조.

### Hybrid Monetization (하이브리드 수익화)
IAP와 IAA를 함께 운영하는 모델. 결제 사용자에게는 광고를 줄이고 비결제 사용자에게는 광고로 수익화한다.

### Subscription (구독)
정기 결제로 프리미엄 기능(광고 제거, 고화질, 독점 콘텐츠)을 제공하는 모델. → MRR, Churn 관리가 핵심이다.

### Freemium (프리미엄, 부분 유료화)
기본 기능은 무료로 제공하고 일부 기능 · 콘텐츠를 유료화하는 모델. Free + Premium의 합성어.

### Paywall (페이월)
무료 사용 한도에 도달했을 때 결제를 요구하는 지점 · 화면. 위치와 메시지가 전환율을 좌우한다.

### Free Trial (무료 체험)
일정 기간 유료 기능을 무료로 제공한 뒤 자동 결제로 전환하는 방식. 체험 → 유료 전환율(Trial Conversion Rate)을 관리한다.

### Virtual Currency / Coin (가상 화폐 · 코인)
현금으로 구매해 앱 안에서 기프트 · 아이템 구매에 쓰는 앱 내 화폐. 크리에이터 후원(→ Gifting)의 결제 수단이 된다. 회계상 미사용 잔액은 → Deferred Revenue다.

### PU (Paying User, 결제 사용자)
특정 기간에 1회 이상 결제한 고유 사용자 수.

### PUR / Conversion Rate to Paying (Paying User Rate, 결제 전환율)
`PU ÷ AU × 100`. 활성 사용자 중 결제자 비율. 무료 서비스는 통상 1~5% 수준이다.

### ARPU (Average Revenue Per User, 사용자당 평균 매출)
`매출 ÷ AU`. 결제 여부와 관계없이 전체 활성 사용자 기준. 기간(일 · 월)을 명시한다.

### ARPPU (Average Revenue Per Paying User, 결제자당 평균 매출)
`매출 ÷ PU`. 결제자의 결제 강도를 나타낸다. ARPU = ARPPU × PUR 관계다.

### ARPDAU (Average Revenue Per Daily Active User, DAU당 평균 매출)
`일 매출 ÷ DAU`. IAA 중심 서비스의 일간 수익성 지표로 가장 널리 쓰인다. IAP와 IAA를 분리해 ARPDAU(IAP), ARPDAU(IAA)로도 본다.

### ARPMAU (Average Revenue Per Monthly Active User)
`월 매출 ÷ MAU`.

### LTV (Lifetime Value, 고객 생애 가치)
사용자 1명이 서비스를 이용하는 전체 기간 동안 발생시키는 **누적 매출(또는 이익)** 의 기대값. UA 예산의 상한을 정하는 기준이다.

```
단순 추정:      LTV = ARPU × 평균 생애 기간
이탈률 기반:    LTV = ARPU ÷ Churn Rate
리텐션 적분:    LTV(D_N) = Σ (Day i Retention × Day i ARPDAU),  i = 0 … N
```

> 실무 포인트: LTV는 "무한 기간"이 아니라 **D90, D180, D365 등 기간을 정한 예측값(pLTV, Predicted LTV)** 으로 관리한다. 또 매출 기준인지 → Platform Fee와 → Revenue Share를 제한 순이익 기준인지 명시해야 → CAC와 비교할 수 있다.

### CAC (Customer Acquisition Cost, 고객 획득 비용)
`총 마케팅 · 영업 비용 ÷ 신규 고객 수`. CPI는 광고비만 설치 수로 나눈 것이고, CAC는 인건비 · 도구 비용 등을 포함한 넓은 개념이다.

### LTV/CAC Ratio (LTV 대 CAC 비율)
획득 비용 대비 생애 가치. 3:1 이상이면 건전, 1:1 미만이면 획득할수록 손해다. 채널 · 국가 · 코호트 단위로 관리한다.

### Payback Period (회수 기간)
획득 비용을 누적 매출로 회수하는 데 걸리는 기간. 회수 기간이 짧을수록 같은 예산으로 더 빨리 재투자할 수 있다.

### ROAS (Return On Ad Spend, 광고 수익률)
`광고 기인 매출 ÷ 광고비 × 100`. 캠페인 단위 효율 지표. 기간(D7 ROAS, D30 ROAS)을 반드시 붙인다. 100% 미만이면 광고비를 아직 회수하지 못한 상태다.

### ROI (Return On Investment, 투자 수익률)
`(이익 − 투자액) ÷ 투자액 × 100`. ROAS는 매출 기준, ROI는 **이익** 기준이며 마케팅 외 비용도 포함한다.

### Whale / Dolphin / Minnow (고래 / 돌고래 / 피라미)
결제 금액 규모에 따른 사용자 분류. 게임 업계 관용어로 Whale은 상위 고액 결제자를 뜻한다. 소수 Whale이 매출의 대부분을 차지하는 구조는 → Pareto Principle의 예다.

### Repeat Purchase Rate (재구매율)
결제 사용자 중 2회 이상 결제한 비율. 결제 습관화 정도를 나타낸다.

### Price Elasticity (가격 탄력성)
가격 변화에 대한 수요 변화 민감도. 코인 패키지 가격 실험으로 측정한다.

### Price Anchoring / Tiered Pricing (가격 앵커링 / 계층형 가격)
고가 옵션을 함께 제시해 중간 옵션을 합리적으로 보이게 하는 기법과, 3~5단계 가격대를 두는 구성.

### Pricing Localization (가격 현지화)
국가별 구매력에 맞춰 가격을 차등 설정하는 것. 스토어 기본 환율 적용과 별개로 가격대(Price Tier)를 국가별로 조정한다.

## 10. 매출 · 정산 · 계약 (Gross · Net · Revenue Share)

### Gross Revenue / Gross Sales / Gross Billings (총매출)
사용자가 실제 결제한 금액의 총합. **플랫폼 수수료, 환불, 세금, 파트너 분배 등을 차감하기 전** 금액. "매출"이라고만 하면 오해가 생기므로 반드시 Gross인지 Net인지 명시한다.

### Net Revenue (순매출)
Gross Revenue에서 계약 · 회계 기준으로 정한 항목을 차감한 금액. **차감 항목이 계약마다 다르다**는 점이 핵심이다.

일반적으로 차감하는 항목:
- 앱스토어 · 결제 대행 수수료 (→ Platform Fee)
- 환불 · 지급 거절 (→ Refund, Chargeback)
- 부가가치세 등 간접세 (→ VAT)
- 원천징수세 (→ Withholding Tax)
- 결제 수수료 (PG 수수료)

계약에 따라 추가로 차감할 수 있는 항목:
- 마케팅비, 서버 · 운영비, 고객지원 비용, 크리에이터 지급액

> 실무 포인트: 파트너 계약서에서 "Net Revenue의 X%"를 분배한다고 할 때, **Net Revenue의 정의 조항(Definition)** 이 실제 정산 금액을 결정한다. 마케팅비까지 차감하는 정의라면 파트너 몫이 크게 줄어든다. 정의 조항과 산출 예시(Worked Example)를 계약서에 함께 넣는 것이 분쟁 예방의 기본이다.

### Gross vs Net 산출 예시

| 항목 | 금액 | 비고 |
|---|---|---|
| 사용자 결제 총액 (Gross Revenue) | 100,000 | 스토어 표시 가격 합계 |
| (−) 부가가치세 10% | −9,091 | 세금 포함 가격이므로 역산 (100,000 ÷ 1.1) |
| (−) 플랫폼 수수료 30% | −27,273 | 세후 금액 기준, 스토어 정책에 따라 15% |
| (−) 환불 · 지급 거절 | −1,000 | 실제 발생분 |
| **Net Revenue (플랫폼 정산 기준)** | **62,636** | 스토어가 개발사에 지급하는 금액 근사 |
| (−) 크리에이터 Revenue Share 50% | −31,318 | 계약상 "Net Revenue의 50%"라고 가정 |
| **회사 잔여 매출** | **31,318** | |

숫자는 설명용이며 세율 · 수수료율은 국가와 스토어 정책에 따라 다르다.

### Revenue Share (수익 배분, 레비뉴 셰어, RS)
발생한 매출을 사전에 정한 비율로 둘 이상의 당사자가 나누는 계약 방식. 숏폼에서는 **크리에이터 수익 배분**, **퍼블리셔 · 개발사 배분**, **광고 네트워크와 매체 배분**에 모두 쓰인다.

계약서에 반드시 정해야 하는 요소:
1. **분배 기준(Base)**: Gross인지 Net인지, Net이면 차감 항목.
2. **비율(Split)**: 고정 비율인지 구간별 차등(Tiered)인지.
3. **정산 주기와 지급 시점**: 월 정산, 익월 말 지급(Net 30 / Net 60) 등.
4. **통화와 환율 기준일**.
5. **최소 지급액(Minimum Payout Threshold)** 과 이월 규칙.
6. **감사권(Audit Right)** 과 정산 보고서 제공 의무.
7. **세금 처리 주체**(원천징수 여부).

### Platform Fee / Store Commission (플랫폼 수수료, 스토어 수수료)
Apple App Store, Google Play가 인앱 결제 금액에서 가져가는 수수료. 표준 30%, 연 매출 100만 달러 이하 사업자와 1년 이상 유지된 구독은 15%. 한국은 인앱결제 강제 금지법(2021년 전기통신사업법 개정) 이후 제3자 결제 허용 시 26% 등 별도 요율이 있고, EU는 디지털시장법(DMA)에 따라 다른 구조가 적용된다. 정책 변동이 잦아 정산 로직은 요율을 **설정값**으로 분리한다.

### Take Rate (테이크 레이트, 수취율)
플랫폼이 거래 금액(→ GMV) 중 수수료로 가져가는 비율. 크리에이터 후원 100원 중 플랫폼이 30원을 갖고 70원을 지급하면 Take Rate는 30%다. 플랫폼 수익성의 핵심 지표다.

### GMV (Gross Merchandise Value, 총 거래액)
플랫폼을 통해 거래된 상품 · 서비스의 총 금액. 플랫폼 자체 매출이 아니라 **거래 규모**다. 라이브 커머스, 크리에이터 후원 규모를 표현할 때 쓴다. 플랫폼 매출 = GMV × Take Rate.

### Bookings (예약 매출, 결제 발생액)
결제가 발생한 시점의 금액. 회계상 매출(Revenue)은 서비스 제공 시점에 인식하므로 구독 · 코인 판매에서는 Bookings와 Revenue가 다르다.

### Revenue Recognition (수익 인식)
회계 기준(IFRS 15, K-IFRS 1115)에 따라 매출을 장부에 인식하는 시점과 방식. 12개월 구독 결제는 매월 1/12씩 인식하고, 코인은 사용 시점에 인식하는 것이 원칙이다.

### Deferred Revenue (선수수익, 이연 매출)
결제는 받았지만 아직 서비스를 제공하지 않아 매출로 인식하지 않은 금액. 미사용 코인 잔액, 남은 구독 기간이 해당한다. 부채로 기록된다.

### Refund / Chargeback (환불 / 지급 거절)
- **Refund**: 사용자 요청으로 결제를 되돌려주는 것.
- **Chargeback**: 카드사가 부정 사용 · 분쟁으로 결제를 강제 취소하는 것. 비율이 높으면 결제 대행사 제재를 받는다.

### Fraud / Payment Fraud (결제 부정)
도난 카드, 환불 악용, 리셀러 우회 결제 등. 코인 지급 전 검증, 이상 거래 탐지가 필요하다.

### Settlement (정산)
일정 기간의 거래를 집계해 각 당사자에게 지급할 금액을 확정하는 절차. 스토어 → 회사, 회사 → 크리에이터 두 단계 정산이 존재한다.

### Payout (지급)
정산이 확정된 금액을 실제로 송금하는 것. 크리에이터 지급은 최소 지급액, 지급 수단(계좌, PayPal 등), 본인 확인(KYC), 세금 서류를 관리해야 한다.

### Minimum Payout Threshold (최소 지급액)
누적 정산액이 일정 금액 이상일 때만 지급하고 미달분은 다음 달로 이월하는 기준. 송금 수수료 대비 효율을 위해 둔다.

### Net 30 / Net 60 (지급 조건)
정산 마감일로부터 30일 · 60일 이내 지급한다는 결제 조건. 스토어 정산도 통상 익월 말~익익월 초에 입금된다.

### MG (Minimum Guarantee, 최소 보장금)
실제 매출과 무관하게 파트너에게 보장하는 최소 금액. 크리에이터 독점 계약, 콘텐츠 라이선스 계약에 쓰인다.

### Recoupable / Non-recoupable (회수 가능 / 회수 불가 선급금)
- **Recoupable Advance**: 선지급금을 이후 발생하는 수익 배분에서 차감(회수)하는 구조.
- **Non-recoupable**: 회수하지 않는 순수 보장금.

### Royalty (로열티)
지식재산(음원, 캐릭터, 영상 등) 사용 대가로 지급하는 사용료. 매출 비례 또는 건당 정액으로 정한다.

### Licensing (라이선싱)
지식재산 사용 권리를 계약으로 허락받는 것. 숏폼에서는 **음원 라이선스**가 가장 중요한 항목이며, 국가별 저작권 관리단체 및 음원 유통사와 계약이 필요하다.

### Exclusivity (독점)
특정 크리에이터 · 콘텐츠가 우리 플랫폼에만 게시되도록 하는 계약 조건. 독점 기간, 범위(플랫폼 · 지역), 위반 시 조치를 정한다.

### VAT (Value Added Tax, 부가가치세) / Sales Tax (판매세)
디지털 서비스에도 소비자 소재 국가 기준으로 부과되는 간접세. 스토어가 대신 징수 · 납부하는 국가와 개발사가 직접 신고해야 하는 국가가 나뉜다.

### Withholding Tax (원천징수세)
소득을 지급하는 쪽이 세금을 미리 떼고 지급하는 제도. 해외 크리에이터에게 지급할 때 조세조약에 따라 요율이 달라지며, 세금 서류(미국 W-8BEN 등)를 받아야 한다.

### Invoice (청구서, 인보이스)
거래 금액 · 항목 · 지급 조건을 적은 청구 문서. B2B 광고주 정산, 파트너 정산에 필수다.

### Statement of Account / Settlement Report (정산 보고서)
정산 기간의 매출, 차감 항목, 분배 비율, 지급액을 상세히 기재한 문서. Revenue Share 계약에서 파트너에게 제공 의무가 있는 경우가 많다.

### Audit Right (감사권)
계약 상대방의 정산 근거 데이터를 검증할 수 있는 권리. 통상 연 1회, 사전 통지 후 실시한다.

### SLA (Service Level Agreement, 서비스 수준 협약)
B2B 계약에서 가용성, 응답 시간, 보고 주기 등 서비스 품질 기준과 미달 시 보상을 정한 조항.

## 11. 재무 · 단위 경제

### Unit Economics (단위 경제)
사용자 1명(또는 거래 1건) 단위의 매출과 비용 구조. LTV, CAC, 사용자당 서버 비용, 사용자당 크리에이터 지급액으로 구성된다. 규모를 키웠을 때 수익이 나는 구조인지 판단하는 기준이다.

### COGS (Cost of Goods Sold, 매출 원가)
매출을 발생시키기 위해 직접 들어간 비용. 디지털 서비스에서는 서버 · CDN 비용, 결제 수수료, 크리에이터 지급액, 콘텐츠 라이선스비가 해당한다. 숏폼은 **영상 트래픽에 비례하는 CDN 비용**이 원가의 핵심이다.

### Gross Margin (매출 총이익률)
`(매출 − COGS) ÷ 매출 × 100`. 서비스 자체의 수익 구조 건전성을 보여준다.

### Contribution Margin (공헌 이익)
매출에서 변동비(COGS + 변동 마케팅비)를 뺀 금액. 고정비 회수에 기여하는 부분이다. 사용자 1인당 공헌 이익이 양수여야 성장에 의미가 있다.

### OPEX / CAPEX (운영 비용 / 자본 지출)
- **OPEX (Operating Expense)**: 인건비, 마케팅비, 클라우드 사용료 등 경상 비용.
- **CAPEX (Capital Expenditure)**: 장비 · 설비 · 자산 취득 비용. 클라우드 전환 이후 대부분의 IT 비용은 OPEX다.

### P&L (Profit and Loss Statement, 손익계산서)
일정 기간의 매출, 비용, 이익을 정리한 재무 보고서.

### EBITDA (Earnings Before Interest, Taxes, Depreciation and Amortization)
이자 · 세금 · 감가상각 차감 전 영업이익. 영업 활동 자체의 현금 창출력을 비교할 때 쓴다.

### BEP (Break-Even Point, 손익분기점)
총 매출이 총 비용과 같아지는 지점. 사용자 수 · 매출 · 기간 기준으로 표현한다.

### Burn Rate (번 레이트, 자금 소진율)
월간 순현금 지출액. 매출이 비용보다 적을 때 매달 줄어드는 현금 규모다.

### Runway (런웨이)
현재 보유 현금으로 사업을 유지할 수 있는 기간. `현금 잔고 ÷ 월 Burn Rate`.

### MRR / ARR (Monthly / Annual Recurring Revenue, 월간 · 연간 반복 매출)
구독처럼 정기적으로 반복되는 매출의 월 · 연 환산액. 일회성 결제는 제외한다. `ARR = MRR × 12`.

### Net Revenue Retention (NRR, 순매출 유지율)
기존 고객 코호트의 매출이 1년 뒤 얼마로 유지 · 확대되었는지의 비율. 100% 초과면 이탈 손실보다 업셀 · 확장이 크다는 의미다. 구독 사업 지표다.

### Forecast / Budget / Actual (예측 / 예산 / 실적)
사업 계획 수치 체계. 예산 대비 실적 차이(Variance)를 월 단위로 분석한다.

### Sensitivity Analysis / Scenario Planning (민감도 분석 / 시나리오 계획)
핵심 가정(CPI, 리텐션, ARPDAU)이 변할 때 결과가 얼마나 흔들리는지 보는 분석과, 낙관 · 기본 · 보수 시나리오를 함께 세우는 계획 방식.

### Cash Flow (현금 흐름)
실제 현금이 들어오고 나가는 흐름. 스토어 정산 지연(→ Net 30/60)과 크리에이터 선지급으로 매출과 현금 유입 시점이 어긋나므로 별도 관리한다.

## 12. 광고 기술 (Ad Tech)

### Ad Inventory (광고 인벤토리, 광고 지면)
서비스가 판매할 수 있는 광고 노출 기회의 총량. 숏폼에서는 피드 사이의 광고 슬롯 수 × 시청 수로 결정된다.

### Ad Format (광고 형식)
- **In-feed Video Ad (인피드 동영상 광고)**: 피드 사이에 콘텐츠처럼 삽입되는 세로형 영상 광고. 숏폼의 주력 형식.
- **Rewarded Video (보상형 동영상)**: 시청 완료 시 사용자에게 보상(코인 등)을 주는 광고. 사용자 자발 선택형이라 만족도와 eCPM이 높다.
- **Interstitial (전면 광고)**: 화면 전체를 덮는 광고. 노출 빈도가 높으면 리텐션을 해친다.
- **Banner (배너)**: 화면 일부에 상시 노출. 단가가 낮다.
- **Native Ad (네이티브 광고)**: 서비스 UI와 동일한 형태로 자연스럽게 삽입되는 광고.
- **Playable Ad (플레이어블 광고)**: 게임을 직접 체험하는 인터랙티브 광고.

### Ad Load (광고 부하)
콘텐츠 대비 광고 노출 비율(예: 영상 8개당 광고 1개). 높이면 단기 매출이 늘지만 리텐션과 세션 길이가 줄어드는 대표적인 → Guardrail Metric 트레이드오프 대상이다.

### eCPM (Effective Cost Per Mille, 유효 1,000회 노출당 수익)
`광고 수익 ÷ 노출 수 × 1,000`. 매체(우리 서비스) 입장에서 광고 지면 1,000회 노출당 실제 벌어들인 금액. 과금 방식(CPC, CPI 등)이 달라도 노출 기준으로 환산해 비교한다.

### Fill Rate (충족률)
`광고가 실제 노출된 요청 수 ÷ 광고 요청 수 × 100`. 100% 미만이면 광고 요청을 했지만 팔리지 않은 지면이 있다는 뜻이다. 신흥 시장이나 비인기 지면에서 낮아진다.

### Ad Request / Ad Impression / Show Rate
광고를 요청한 수, 실제 노출된 수, 그리고 광고가 로드된 뒤 실제 표시된 비율. 로드 후 화면 전환으로 노출되지 않는 경우 Show Rate가 떨어진다.

### RPM (Revenue Per Mille, 1,000회당 수익)
콘텐츠 페이지뷰 또는 세션 1,000회당 총 광고 수익. eCPM은 광고 노출 기준, RPM은 콘텐츠 · 사용자 기준이라는 차이가 있다.

### Mediation (미디에이션, 광고 중개)
여러 광고 네트워크를 하나의 SDK로 연결하고, 요청마다 가장 높은 단가를 제시하는 네트워크에 노출을 배정하는 계층. Google AdMob, AppLovin MAX, Unity LevelPlay 등.

### Waterfall (워터폴)
미디에이션에서 네트워크를 예상 eCPM 순서로 나열하고 위에서부터 차례로 광고를 요청하는 전통적 방식. 지연이 크고 실제 최고가를 놓치기 쉽다.

### In-app Bidding / Header Bidding (인앱 비딩 / 헤더 비딩)
모든 네트워크가 동시에 실시간 입찰해 최고가가 낙찰되는 방식. 워터폴을 대체하는 현재 표준이다.

### Programmatic Advertising (프로그래매틱 광고)
사람이 협상하는 대신 소프트웨어가 실시간으로 광고 거래를 수행하는 방식.

### RTB (Real-Time Bidding, 실시간 입찰)
광고 노출 기회마다 밀리초 단위 경매를 여는 프로그래매틱 거래 방식.

### DSP / SSP / Ad Exchange (수요 측 · 공급 측 플랫폼 · 광고 거래소)
- **DSP (Demand-Side Platform)**: 광고주가 여러 지면을 구매하는 플랫폼.
- **SSP (Supply-Side Platform)**: 매체가 지면을 판매하는 플랫폼.
- **Ad Exchange**: DSP와 SSP를 연결하는 거래소.

### Direct Deal / Programmatic Guaranteed (직접 거래 / 프로그래매틱 보장 거래)
광고주와 매체가 직접 협상해 노출량과 단가를 확정하는 거래. 브랜드 광고주 대상 프리미엄 지면 판매에 쓰인다.

### Ad Sales / Sales House (광고 영업 · 미디어렙)
자사 지면을 광고주에게 직접 판매하는 조직 또는 이를 대행하는 미디어렙. 네트워크 광고보다 단가가 높다.

### Viewability (시인성)
광고가 실제로 사용자 화면에 보였는지의 기준. MRC(Media Rating Council) 표준은 디스플레이 광고는 픽셀 50% 이상 1초, 동영상은 50% 이상 2초다. 광고주는 시인성 기준 노출만 인정하려 한다.

### Ad Fraud (광고 사기)
봇 트래픽, 클릭 스팸, 설치 하이재킹, SDK 스푸핑 등으로 광고 성과를 위조하는 행위. UA 측면에서는 MMP의 사기 방지 기능으로 걸러내고, 매체 측면에서는 무효 트래픽(IVT, Invalid Traffic)을 제거해야 광고주 신뢰를 유지한다.

### Brand Safety / Brand Suitability (브랜드 안전성 · 적합성)
광고가 부적절한 콘텐츠(폭력, 성인, 혐오) 옆에 노출되지 않도록 하는 관리. UGC 플랫폼이 광고주를 유치할 때 가장 먼저 검증받는 항목이다. → Content Moderation

### Ad Verification (광고 검증)
제3자(IAS, DoubleVerify, MOAT 등)가 시인성 · 브랜드 안전성 · 사기 여부를 독립 측정하는 서비스.

### Ad Server (애드 서버)
광고 소재를 저장하고 규칙에 따라 노출을 결정 · 집계하는 시스템.

### Ad Tag / SDK (광고 태그 / SDK)
웹은 스크립트 태그, 앱은 광고 네트워크 SDK를 삽입해 광고를 요청 · 표시한다. SDK 수가 늘면 앱 용량과 크래시가 증가하므로 미디에이션으로 최소화한다.

### Contextual Targeting (문맥 타겟팅)
사용자 식별 정보 대신 **콘텐츠 내용**(영상 주제, 카테고리)을 기준으로 광고를 매칭하는 방식. 개인정보 규제 강화로 재부상했다.

### Ad Frequency / Ad Pacing (광고 노출 간격 · 속도 조절)
사용자 1명에게 광고를 얼마나 자주 보여줄지와 예산을 기간에 걸쳐 어떻게 배분할지 제어하는 설정.

## 13. 콘텐츠 · 크리에이터 이코노미

### Creator Economy (크리에이터 이코노미)
개인 창작자가 콘텐츠로 수익을 얻고, 플랫폼 · 광고주 · 팬이 그 생태계를 구성하는 경제 구조. 숏폼 플랫폼의 공급 측 핵심이다.

### UGC / PGC / AIGC (사용자 · 전문가 · AI 생성 콘텐츠)
- **UGC (User-Generated Content)**: 일반 사용자가 만든 콘텐츠. 숏폼의 기본 공급원.
- **PGC (Professionally-Generated Content)**: 방송사 · 스튜디오 · 전문 크리에이터가 만든 콘텐츠.
- **AIGC (AI-Generated Content)**: 생성형 AI로 만든 콘텐츠. 표시 의무와 저작권 정책이 각국에서 정립되는 중이다.

### Creator / Influencer / KOL (크리에이터 / 인플루언서 / 핵심 오피니언 리더)
콘텐츠 제작자, 팔로워 영향력이 있는 제작자, 특정 분야 전문성으로 영향력을 가진 인물. 중화권에서는 KOL(Key Opinion Leader)이라는 표현을 주로 쓴다.

### Creator Tier (크리에이터 등급)
팔로워 규모별 분류. 통상 Nano(1천~1만), Micro(1만~10만), Mid(10만~50만), Macro(50만~100만), Mega(100만 이상)로 나누지만 기준은 업계 관례이며 고정된 것은 아니다. 마이크로 인플루언서는 참여율이 높고 단가가 낮아 효율 채널로 평가된다.

### MCN (Multi-Channel Network, 다중 채널 네트워크)
다수 크리에이터를 소속시켜 매니지먼트, 광고 영업, 제작 지원을 하는 사업자. 플랫폼은 MCN과 B2B 계약으로 크리에이터를 대량 확보한다.

### Creator Fund / Creator Program (크리에이터 펀드 · 프로그램)
플랫폼이 조회수 · 시청 시간 등 성과에 따라 크리에이터에게 지급하는 보상 제도. 초기 공급 확보 수단이며, 지급 기준(적격 조건, 산식, 국가)을 공개하고 어뷰징을 방지해야 한다.

### Ad Revenue Sharing (광고 수익 배분)
크리에이터 영상에 붙은 광고 수익을 일정 비율로 크리에이터에게 배분하는 제도. → Revenue Share의 크리에이터 적용 형태다.

### Gifting / Virtual Gift / Tipping (기프팅 · 가상 선물 · 후원)
시청자가 코인으로 구매한 가상 선물을 크리에이터에게 보내고, 플랫폼이 → Take Rate를 제한 뒤 크리에이터에게 지급하는 구조. 라이브 방송의 주 수익원이다.

### Fan Subscription / Membership (팬 구독 · 멤버십)
시청자가 특정 크리에이터에게 월 정기 결제하고 독점 콘텐츠 · 배지 등을 받는 모델.

### Branded Content / Sponsored Content (브랜디드 · 협찬 콘텐츠)
광고주가 비용을 지불하고 크리에이터가 제작하는 홍보 콘텐츠. 플랫폼은 광고 표시 태그와 광고주-크리에이터 매칭 도구(Creator Marketplace)를 제공해 수수료를 얻는다.

### 광고 고지 의무 (Ad Disclosure)
협찬 · 광고 콘텐츠임을 소비자가 알 수 있게 표시해야 하는 법적 의무. 한국은 공정거래위원회 「추천 · 보증 등에 관한 표시 · 광고 심사지침」, 미국은 FTC 가이드가 근거다. 표시 위치는 소비자가 쉽게 인식할 수 있어야 한다(본문 첫 줄, 영상 내 자막 등).

### Product Placement / PPL (간접 광고)
콘텐츠 내에 제품을 자연스럽게 노출하는 광고 방식.

### Live Commerce (라이브 커머스)
라이브 방송 중 상품을 소개하고 즉시 구매하게 하는 판매 방식. 성과는 → GMV, 전환율, 동시 시청자 수로 측정한다.

### Affiliate Link / Shoppable Video (제휴 링크 · 쇼퍼블 영상)
영상에 상품 링크를 붙여 구매 발생 시 크리에이터와 플랫폼이 수수료를 받는 구조.

### Views / View Count (조회수)
영상이 재생된 횟수. **조회 인정 기준(자동 재생 포함 여부, 최소 시청 시간)** 이 플랫폼마다 다르므로 외부 비교 시 주의한다. 내부적으로는 조회 정의를 문서화한다.

### Watch Time / Average View Duration (시청 시간 · 평균 시청 시간)
영상별 총 시청 시간과 조회 1회당 평균 시청 시간. 추천 알고리즘의 핵심 입력값이다.

### Completion Rate / VTR (View-Through Rate, 완주율)
`영상을 끝까지 본 조회 수 ÷ 전체 조회 수 × 100`. 숏폼 콘텐츠 품질의 대표 지표. 광고에서는 광고 영상을 끝까지 본 비율을 뜻한다.

### Hook Rate / Thumb-stop Rate (초반 이탈 방어율)
피드에서 영상이 노출되었을 때 처음 2~3초를 넘겨 계속 시청한 비율. 첫 장면(Hook)의 효과를 측정한다. 광고 소재 평가에도 쓴다.

### Rewatch Rate / Loop Rate (재시청율 · 반복 재생율)
같은 사용자가 영상을 2회 이상 재생한 비율. 짧은 영상에서 강한 관심 신호로 해석한다.

### Share Rate / Save Rate (공유율 · 저장율)
`공유 수 ÷ 조회 수`, `저장 수 ÷ 조회 수`. 공유는 외부 유입(→ K-factor)으로, 저장은 개인적 가치로 연결되는 신호다.

### Follower / Follow Conversion (팔로워 · 팔로우 전환율)
크리에이터를 구독한 사용자 수와, 영상 시청자 중 팔로우까지 이어진 비율.

### Virality / Viral Coefficient (콘텐츠 바이럴성)
조회당 공유 수 또는 공유로 유입된 신규 조회 비율. 알고리즘 노출과 외부 확산이 결합된 결과다.

### Trend / Challenge / Hashtag (트렌드 · 챌린지 · 해시태그)
특정 음원, 형식, 주제가 짧은 기간에 대량 재생산되는 현상과 그 매개체. 플랫폼은 공식 챌린지를 운영해 참여형 콘텐츠 공급을 유도한다.

### Sound / Music Licensing (음원 · 음악 라이선스)
숏폼 영상에 사용되는 배경 음원의 사용 권리. 저작권(작사 · 작곡), 저작인접권(실연 · 음반)이 분리되어 있어 별도 계약이 필요하다. 라이선스 없는 음원 사용은 콘텐츠 삭제와 → Demonetization 사유가 된다.

### Content ID / Fingerprinting (콘텐츠 식별)
음원 · 영상의 지문(Fingerprint)을 대조해 저작물 사용을 자동 식별하는 기술. 권리자 수익 배분과 침해 차단에 쓴다.

### Content Moderation (콘텐츠 검수, 모더레이션)
커뮤니티 가이드라인 위반 콘텐츠를 자동(AI) 또는 수동으로 검수 · 조치하는 운영. 사전 검수(Pre-moderation)와 사후 검수(Post-moderation)로 나뉜다. → Brand Safety의 전제이며, 각국 규제(EU 디지털서비스법 DSA, 한국 정보통신망법)상 의무이기도 하다.

### Community Guidelines (커뮤니티 가이드라인)
플랫폼이 허용 · 금지하는 콘텐츠와 행동 기준을 공개한 문서. 제재 기준의 근거가 된다.

### Demonetization (수익화 제한)
가이드라인 위반이나 광고 부적합 판정으로 콘텐츠 · 계정의 수익 배분을 중단하는 조치.

### Shadow Ban (섀도 밴)
사용자에게 알리지 않고 노출을 제한하는 조치를 가리키는 관용어. 공식 정책 용어가 아니며, 노출 제한(Reach Restriction)은 사유와 함께 고지하는 것이 신뢰 관점에서 권장된다.

### Copyright Strike / Takedown (저작권 경고 · 게시 중단)
권리자의 신고에 따라 콘텐츠를 내리고 계정에 경고를 누적하는 절차. 미국 DMCA(Digital Millennium Copyright Act) 절차가 국제적 관행의 기준이 되었다.

### Age Rating / Content Rating (연령 등급)
콘텐츠 · 앱의 연령 적합성 분류. 스토어 등급(IARC 등)과 국가별 심의 기준이 있으며, 청소년 보호 조치(야간 이용 제한, 결제 한도)와 연결된다.

## 14. 추천 · 피드 운영

### Recommendation System (추천 시스템)
사용자의 행동 · 속성을 기반으로 다음에 볼 콘텐츠를 순서대로 골라 제시하는 시스템. 숏폼의 핵심 제품이자 → Long Tail 소비를 만드는 장치다.

### For You Feed / Personalized Feed (개인화 피드)
팔로우 여부와 관계없이 추천 알고리즘이 구성하는 피드. 팔로잉 피드(Following Feed)와 대비된다.

### Feed Ranking (피드 랭킹)
후보 콘텐츠를 예측 점수(시청 완료 확률, 좋아요 확률, 공유 확률 등)로 정렬하는 단계. 여러 목표를 가중 합산하는 **다목적 최적화**를 한다.

### Candidate Generation / Ranking / Re-ranking (후보 생성 / 랭킹 / 재정렬)
수백만 콘텐츠에서 수백 개 후보를 뽑고(Recall), 정밀 모델로 순서를 매기고, 다양성 · 신선도 · 정책 규칙을 반영해 최종 순서를 조정하는 3단계 구조.

### Collaborative Filtering / Content-based Filtering (협업 필터링 / 콘텐츠 기반 필터링)
- **Collaborative**: 비슷한 사용자가 좋아한 것을 추천.
- **Content-based**: 사용자가 좋아한 콘텐츠와 속성이 비슷한 것을 추천. 신규 콘텐츠 콜드 스타트에 유리하다.

### Cold Start (콜드 스타트)
신규 사용자(행동 데이터 없음) 또는 신규 콘텐츠(반응 데이터 없음)에 대한 추천 품질 문제. 신규 콘텐츠에는 **초기 노출 할당(Exploration Budget)** 을 주어 반응을 수집한다.

### Exploration / Exploitation (탐색 / 활용)
검증된 인기 콘텐츠를 보여주는 것(Exploitation)과 반응이 불확실한 새 콘텐츠를 시험 노출하는 것(Exploration)의 균형. 탐색이 없으면 신규 크리에이터가 성장할 수 없다.

### Implicit Feedback / Explicit Feedback (암묵적 · 명시적 피드백)
- **Implicit**: 시청 시간, 스킵, 재시청 등 행동 신호. 양이 많지만 해석이 필요하다.
- **Explicit**: 좋아요, "관심 없음", 신고 등 직접 표현. 양은 적지만 명확하다.

### Skip Rate (스킵률)
영상이 노출된 뒤 일정 시간 안에 넘겨진 비율. 부정 신호로 랭킹에 반영된다.

### Filter Bubble / Echo Chamber (필터 버블 · 에코 체임버)
개인화가 과도해 사용자가 비슷한 콘텐츠만 접하게 되는 현상. 다양성(Diversity) 지표를 가드레일로 둔다.

### Diversity / Freshness / Serendipity (다양성 · 신선도 · 의외성)
추천 품질을 정확도 외 관점에서 평가하는 기준. 카테고리 · 크리에이터 분산, 최근 업로드 비중, 예상 밖 발견의 정도.

### Content Supply / Content Velocity (콘텐츠 공급량 · 공급 속도)
일간 신규 업로드 수와 활성 크리에이터 수. 추천이 보여줄 재고이므로 수요(시청 시간)와 함께 관리한다. 공급이 부족하면 같은 영상이 반복 노출되어 리텐션이 떨어진다.

### Creator-to-Viewer Ratio (창작자 대 시청자 비율)
전체 활성 사용자 중 업로드하는 사용자의 비율. UGC 플랫폼은 통상 1~10% 수준이며, 이 비율을 높이는 것이 공급 전략의 목표다.

### Editorial Curation (편집 큐레이션)
운영진이 직접 콘텐츠를 선별해 노출하는 것. 알고리즘 보완, 이벤트 · 캠페인 노출, 콜드 스타트 대응에 쓴다.

### Boost / Promoted Content (부스트 · 유료 노출)
크리에이터나 광고주가 비용을 지불해 콘텐츠 노출을 늘리는 상품. 광고 표시가 필요하다.

## 15. 브랜드 · CRM · 라이프사이클 마케팅

### Brand Marketing (브랜드 마케팅)
즉각적 전환보다 인지도 · 호감도 · 연상을 장기적으로 쌓는 마케팅. → Performance Marketing과 예산을 나눠 운영한다.

### Brand Awareness / Brand Recall / Brand Recognition (인지도 · 상기도 · 재인도)
- **Awareness**: 브랜드를 알고 있는 비율.
- **Recall (비보조 인지)**: 카테고리를 말했을 때 브랜드를 떠올리는 비율.
- **Recognition (보조 인지)**: 브랜드를 제시했을 때 아는 비율.

### Brand Lift Study (브랜드 리프트 조사)
광고 노출 그룹과 비노출 그룹의 인지도 · 호감도 · 구매 의향 차이를 설문으로 측정하는 조사. 브랜드 캠페인의 성과 측정 방법이다.

### Share of Voice (SOV, 광고 점유율 · 언급 점유율)
카테고리 전체 광고 · 언급량 중 우리 브랜드의 비율.

### Brand Equity (브랜드 자산)
브랜드가 만들어내는 추가적 가치. 같은 기능이라도 브랜드 때문에 더 선택되는 정도.

### Tagline / Key Message (태그라인 · 핵심 메시지)
브랜드 · 캠페인을 대표하는 짧은 문구와, 모든 채널에서 일관되게 전달할 메시지.

### Tone and Voice / Tone of Voice (톤 앤 보이스)
브랜드가 말하는 방식과 태도의 일관된 기준. 앱 문구, 푸시, 고객 응대, 광고 카피에 적용한다.

### PR (Public Relations, 홍보)
언론 · 커뮤니티 · 이해관계자와의 관계를 통해 → Earned Media를 확보하는 활동. 보도자료, 기자 간담회, 위기 대응을 포함한다.

### CRM (Customer Relationship Management, 고객 관계 관리)
기존 사용자와의 관계를 유지 · 강화해 리텐션과 결제를 높이는 활동과 시스템. 앱 서비스에서는 푸시 · 인앱 메시지 · 이메일 · 문자 채널을 통한 **라이프사이클 메시징**을 뜻한다. Braze, CleverTap 등이 대표 도구다.

### Lifecycle Marketing (라이프사이클 마케팅)
→ Lifecycle Stage에 따라 다른 메시지와 혜택을 자동으로 보내는 CRM 운영 방식. 신규 온보딩 시리즈, 이탈 위험군 복귀 유도, 결제자 감사 메시지 등.

### Push Notification (푸시 알림)
앱이 설치된 기기로 보내는 알림. 리텐션에 가장 큰 영향을 주는 CRM 채널이지만, 과도하면 알림 차단(Opt-out)과 삭제를 유발한다. 광고성 푸시는 → 정보통신망법의 사전 동의와 야간 제한을 준수한다.

### Push Opt-in Rate (푸시 수신 동의율)
알림 권한을 허용한 사용자 비율. iOS는 명시적 권한 요청이 필요하고, Android 13 이상도 런타임 권한이 필요하다. 권한 요청 시점(Pre-permission Prompt)이 동의율을 좌우한다.

### In-app Message (인앱 메시지)
앱 사용 중 화면에 표시하는 팝업 · 배너 · 툴팁. 푸시와 달리 권한이 필요 없고 맥락에 맞게 노출할 수 있다.

### Trigger-based Campaign / Journey (트리거 캠페인 · 저니)
특정 행동(첫 업로드, 7일 미접속)이 발생하면 자동으로 메시지를 보내는 캠페인과, 여러 단계로 이어진 자동화 흐름.

### Segmentation (세그멘테이션)
행동 · 속성 기준으로 사용자를 나누어 다른 메시지를 보내는 것. → Segment

### Personalization (개인화)
사용자 이름, 최근 시청 카테고리, 팔로우한 크리에이터의 새 영상 등 개인 데이터를 메시지 내용에 반영하는 것.

### Send Time Optimization (발송 시간 최적화)
사용자별로 앱을 가장 자주 여는 시간대에 메시지를 보내는 기능.

### Deliverability / Open Rate / CTR (도달율 · 오픈율 · 클릭률)
푸시 · 이메일이 실제 도달한 비율, 열어본 비율, 클릭한 비율. 푸시 오픈율은 플랫폼 · 카테고리별 편차가 크다.

### Uninstall Rate (삭제율)
설치 후 앱을 삭제한 비율. 푸시 발송 직후 삭제가 늘면 메시지 피로가 원인이다.

### Loyalty Program (로열티 프로그램)
연속 접속 보상, 등급제, 포인트 등 지속 이용에 보상을 주는 제도. 습관 형성(→ Habit Loop)을 지원한다.

### Gamification (게이미피케이션)
배지, 레벨, 미션, 순위표 등 게임 요소를 서비스에 적용해 참여를 유도하는 기법.

### Community Management (커뮤니티 관리)
공식 SNS · 디스코드 · 카페 등에서 사용자와 소통하고 여론을 관리하는 활동.

### Customer Support / VOC (Voice of Customer, 고객의 소리)
고객 문의 대응과, 문의 · 리뷰 · 설문에서 수집한 고객 의견을 제품 개선에 반영하는 체계.

### Omnichannel (옴니채널)
앱, 웹, SNS, 오프라인 등 모든 채널에서 일관된 경험과 데이터를 제공하는 전략. 채널을 병렬로 운영하는 멀티채널보다 통합 수준이 높다.

### Seasonality (시즌성)
시기별 수요 · 비용 변동. 연말 · 연초는 광고 CPM이 오르고, 방학 · 연휴에는 사용 시간이 늘어난다. 전년 동기 비교(YoY)로 시즌 효과를 분리한다.

### Tentpole / Live Ops (대형 이벤트 · 라이브 운영)
분기 · 반기 단위 대형 캠페인과, 상시 운영되는 소규모 이벤트 · 챌린지 운영. 게임 업계의 Live Ops 개념이 숏폼 운영에도 적용된다.

## 16. 소비자 세그먼트와 트렌드 (LOHAS 등)

### LOHAS (Lifestyles Of Health And Sustainability, 로하스)
**건강과 지속 가능성**을 중시하는 소비자 집단과 그 생활 방식. 2000년 미국 사회학자 Paul Ray가 제시한 개념으로, 개인의 건강뿐 아니라 환경 · 사회 · 후세대에 미치는 영향까지 고려해 소비한다. 유기농 식품, 친환경 제품, 웰니스, 공정 무역이 대표 소비 영역이다.

> 실무 포인트: LOHAS는 **타깃 세그먼트이자 콘텐츠 카테고리**로 활용된다. 숏폼에서는 홈트레이닝, 비건 레시피, 제로 웨이스트, 명상 등 LOHAS 콘텐츠 카테고리가 광고주(식품 · 뷰티 · 헬스케어)의 브랜드 적합성이 높은 지면으로 평가된다. 한국에서는 웰빙(Well-being) 이후 이어진 소비 트렌드 용어로 정착했다.

### Wellness (웰니스)
신체 · 정신 · 사회적 건강을 통합적으로 추구하는 상태와 관련 산업. LOHAS의 개인 건강 측면과 겹친다.

### Green Marketing / Greenwashing (그린 마케팅 / 그린워싱)
- **Green Marketing**: 환경 친화성을 소구점으로 하는 마케팅.
- **Greenwashing**: 실제보다 친환경적으로 보이게 과장 · 허위 표시하는 것. 표시 · 광고법 위반과 브랜드 신뢰 훼손으로 이어진다.

### ESG (Environmental, Social, Governance)
환경 · 사회 · 지배구조 관점의 기업 평가 기준. 광고주 · 투자자가 파트너 플랫폼의 콘텐츠 정책과 → Brand Safety를 ESG 관점에서 검토하는 경우가 늘고 있다.

### Value-based Consumption / 미닝아웃 (가치 소비)
가격 · 성능보다 자신의 신념과 가치에 맞는 소비를 우선하는 경향. 소셜 미디어에서 소비 신념을 드러내는 행동을 한국에서는 미닝아웃(Meaning Out)이라 부른다.

### Generation Segment (세대 구분)
- **Millennials (밀레니얼, Y세대)**: 1981~1996년 출생(Pew Research 기준).
- **Gen Z (Z세대)**: 1997~2012년 출생. 숏폼의 핵심 사용층. 짧은 콘텐츠, 세로 화면, 자막 시청에 익숙하다.
- **Gen Alpha (알파세대)**: 2013년 이후 출생. 아동 보호 규제(→ COPPA) 대상이 많다.
- **MZ세대**: 밀레니얼과 Z세대를 묶은 한국식 표현. 해외에서는 쓰지 않는다.

세대 구분 연도는 기관마다 다르므로 보고서에 기준 출처를 표기한다.

### Early Adopter (얼리어답터)
신제품을 초기에 적극 수용하는 소비자. → Technology Adoption Lifecycle의 두 번째 집단으로, 피드백과 입소문의 원천이다.

### Digital Native (디지털 네이티브)
디지털 환경에서 성장해 기술 사용이 자연스러운 세대. Z세대 이후를 가리킨다.

### Prosumer (프로슈머)
소비자이면서 생산에 참여하는 사용자. UGC 플랫폼의 크리에이터가 대표적이다.

### Lifestyle Segmentation / Psychographics (라이프스타일 세분화 · 심리 특성)
인구 통계가 아닌 가치관 · 태도 · 관심사 · 생활 방식으로 소비자를 나누는 방법. LOHAS도 이 방식의 세그먼트다.

### Demographics (인구 통계)
연령, 성별, 지역, 소득 등 객관적 속성 기준 세분화. 광고 타겟팅의 기본 축이다.

### Micro-trend / Macro-trend (마이크로 트렌드 / 메가 트렌드)
수 주~수 개월 지속되는 짧은 유행과, 수 년 이상 지속되는 구조적 변화. 숏폼 챌린지는 마이크로 트렌드, 숏폼 소비 자체는 메가 트렌드다.

### Nudge (넛지)
강제하지 않고 선택 환경을 설계해 바람직한 행동을 유도하는 것. 기본값 설정, 순서 배치 등이 해당한다. 사용자를 속이는 → Dark Pattern과 구분해야 한다.

### Dark Pattern (다크 패턴)
사용자를 속이거나 원치 않는 행동으로 유도하는 UI 설계(숨겨진 구독 해지, 취소 버튼 위장 등). 한국은 2025년 전자상거래법 개정으로 규제 대상이 되었고, EU · 미국도 규제를 강화하고 있다.

## 17. 데이터 분석과 실험

### Event Tracking / Event Taxonomy (이벤트 추적 · 이벤트 체계)
사용자 행동을 이벤트(`video_view`, `video_complete`, `share`)와 속성(영상 ID, 시청 시간)으로 정의해 수집하는 것과 그 명명 규칙. 지표는 이벤트 정의 위에서 산출되므로 **이벤트 체계 문서가 모든 지표의 원본**이다.

### Product Analytics (프로덕트 분석)
사용자 행동 이벤트를 분석해 제품 의사결정에 쓰는 활동과 도구. Amplitude, Mixpanel, Firebase Analytics, GA4 등.

### Cohort Analysis (코호트 분석)
→ Cohort 별로 리텐션 · 매출 등을 비교하는 분석. 제품 변경 전후 효과, 채널별 품질 비교에 필수다.

### Funnel Analysis (퍼널 분석)
→ Funnel 각 단계의 전환율과 이탈률을 측정해 병목을 찾는 분석.

### Retention Analysis / Retention Table (리텐션 분석 · 리텐션 표)
가입 코호트를 행, 경과 일수를 열로 두고 리텐션을 채운 삼각형 표. 대각선 방향으로 읽으면 특정 날짜의 이슈를 찾을 수 있다.

### A/B Test (A/B 테스트, 분할 테스트)
사용자를 무작위로 나눠 대조군(Control, A)과 실험군(Variant, B)에 다른 경험을 제공하고 지표 차이를 비교하는 실험. 원인과 결과를 가장 확실하게 판별하는 방법이다.

### Control / Treatment (대조군 / 실험군)
기존 경험을 유지하는 집단과 변경을 적용한 집단.

### Randomization Unit (무작위 배정 단위)
사용자, 기기, 세션 중 어느 단위로 실험군을 나눌지. 동일 사용자가 다른 기기에서 다른 경험을 받으면 오염(Contamination)이 생긴다.

### Statistical Significance / p-value (통계적 유의성 / p값)
관찰된 차이가 우연일 확률이 충분히 낮은지(통상 p < 0.05) 판단하는 기준. 유의하다는 것이 "효과가 크다"는 뜻은 아니다.

### Confidence Interval (신뢰 구간)
실제 효과가 있을 것으로 추정되는 범위. 점 추정치 하나보다 의사결정에 유용하다.

### MDE (Minimum Detectable Effect, 최소 검출 효과)
실험으로 감지하려는 최소 효과 크기. 작을수록 더 많은 표본과 기간이 필요하다.

### Sample Size / Statistical Power (표본 크기 / 검정력)
필요한 실험 참가자 수와, 실제 효과가 있을 때 그것을 검출할 확률(통상 80%). 실험 시작 전에 계산한다.

### Peeking Problem (조기 확인 문제)
실험 중간에 결과를 반복 확인하다가 우연히 유의해 보이는 순간 종료하는 오류. 사전에 종료 조건을 정하거나 순차 검정(Sequential Testing) 방법을 쓴다.

### Novelty Effect / Primacy Effect (신기 효과 / 익숙함 효과)
새 기능이 처음에는 호기심으로 지표가 오르거나(Novelty), 반대로 기존 사용자가 변경에 적응하지 못해 지표가 떨어지는(Primacy) 일시적 현상. 최소 1~2주 이상 실험한다.

### Holdout Group (홀드아웃 그룹)
장기간 어떤 변경도 적용하지 않고 유지하는 소수 집단. 여러 실험의 누적 효과와 장기 영향을 측정한다.

### Incrementality / Lift (증분 효과)
마케팅 · 기능이 **없었을 때와 비교해 추가로** 만들어낸 성과. 어트리뷰션은 "어디에 귀속되는가"를, 증분 효과는 "정말 효과가 있었는가"를 답한다. 지오 테스트(지역별 광고 집행 · 미집행 비교)가 대표 측정법이다.

### Cannibalization (카니발라이제이션, 잠식)
새 기능 · 채널 · 상품이 기존 것의 성과를 빼앗는 현상. 유료 광고가 자연 유입을 잠식하는 경우, 새 상품이 기존 상품 매출을 잠식하는 경우 등. 순증분(Net Incremental) 관점으로 평가한다.

### Correlation / Causation (상관 / 인과)
함께 움직이는 것과 원인이 되는 것의 차이. 관찰 데이터의 상관을 인과로 단정하지 않고 실험으로 검증한다.

### Selection Bias / Survivorship Bias (선택 편향 / 생존자 편향)
분석 대상이 특정 방식으로 걸러져 결론이 왜곡되는 현상. "결제자는 리텐션이 높다"는 원래 리텐션이 높은 사용자가 결제하는 것일 수 있다.

### Simpson's Paradox (심슨의 역설)
전체로 보면 나타나는 경향이 세그먼트로 나누면 뒤집히는 현상. 국가 · 플랫폼 구성 비율이 변하면 전체 지표가 실제 변화와 다르게 움직인다.

### Data Warehouse / ETL / ELT (데이터 웨어하우스 / 적재 파이프라인)
분석용 데이터 저장소와, 원천 데이터를 추출(Extract) · 변환(Transform) · 적재(Load)하는 과정. BigQuery, Snowflake, Redshift 등.

### Single Source of Truth (SSOT, 단일 진실 공급원)
같은 지표는 하나의 정의와 하나의 데이터 소스에서만 산출한다는 원칙. 팀별 대시보드 수치 불일치를 막는다.

### Data Governance (데이터 거버넌스)
데이터 정의, 품질, 접근 권한, 보존 기간, 개인정보 처리 규칙을 관리하는 체계.

## 18. 출시 · 운영 전략

### Soft Launch (소프트 론칭)
일부 국가 · 소수 사용자에게 먼저 출시해 리텐션 · 수익화 · 안정성을 검증하는 단계. 게임 업계에서는 캐나다, 호주, 필리핀, 북유럽 등을 테스트 마켓으로 자주 쓴다.

### Closed Beta / Open Beta (비공개 · 공개 베타)
초대된 사용자만 참여하는 테스트와, 누구나 참여할 수 있지만 정식 출시 전임을 명시한 테스트.

### Pre-registration (사전 예약)
정식 출시 전 스토어 또는 자체 페이지에서 사전 등록을 받아 출시일에 알림 · 보상을 제공하는 것. 출시 첫 주 다운로드를 집중시켜 → Store Ranking 진입을 돕는다.

### Global Launch / Hard Launch (글로벌 출시 · 정식 출시)
전체 시장에 정식 출시하고 마케팅 예산을 본격 집행하는 단계.

### Phased Rollout / Staged Rollout (단계적 출시)
신규 버전을 사용자 일부(1% → 10% → 50% → 100%)에게 순차 배포해 문제를 조기 발견하는 방식. 기술적 배포 전략은 `network-glossary.md`의 17장 배포 전략을 참조.

### Feature Flag (기능 플래그)
코드 배포와 기능 공개를 분리해, 설정으로 특정 사용자에게만 기능을 켜는 방식. A/B 테스트와 단계적 출시의 기술적 기반이다.

### Localization (L10n, 현지화) / Internationalization (i18n, 국제화)
- **Internationalization**: 여러 언어 · 지역을 지원할 수 있는 구조로 제품을 만드는 것.
- **Localization**: 특정 언어 · 지역에 맞춰 번역, 통화, 날짜 형식, 콘텐츠를 조정하는 것.

### Culturalization (문화화)
번역을 넘어 색상, 상징, 유머, 규제 등 문화적 맥락을 반영하는 것. 콘텐츠 검수 기준도 국가별로 다르다.

### LQA (Localization Quality Assurance, 현지화 품질 검수)
번역과 현지화 결과를 실제 화면에서 검증하는 작업.

### Market Entry Strategy (시장 진입 전략)
국가별 진입 순서, 직접 진출 · 퍼블리셔 제휴 · 합작 등 진입 방식을 결정하는 것.

### Publisher / Publishing Contract (퍼블리셔 · 퍼블리싱 계약)
개발사 대신 특정 지역의 출시 · 마케팅 · 운영을 맡는 사업자와 그 계약. 통상 → Revenue Share와 → MG 구조로 정산한다.

### Partnership / Alliance (제휴)
통신사 선탑재, 결제사 프로모션, 플랫폼 간 콘텐츠 연동 등 외부 사업자와의 협력.

### Preload / Pre-install (선탑재)
단말 제조사 · 통신사와 계약해 출고 시 앱을 미리 설치하는 것. 설치 수는 크지만 실행률이 낮아 → Activation 기준으로 평가한다.

### KPI Review / Post-mortem (성과 리뷰 / 사후 분석)
캠페인 · 출시 후 목표 대비 실적과 원인을 정리하는 회의 · 문서. 실패 원인을 비난 없이 기록하는 것이 목적이다.

### Sunset / EOL (End of Life, 서비스 종료)
서비스 · 기능을 종료하는 것. 사용자 고지 기간, 환불 · 잔여 코인 처리, 데이터 파기 절차가 법적으로 요구된다.

| 지표 | 산식 | 단위 · 비고 |
|---|---|---|
| Stickiness | DAU ÷ MAU | 비율. 월 평균 접속 일수 ÷ 30과 같음 |
| Day N Retention (Classic) | N일째 활성 사용자 ÷ 코호트 사용자 | %. 방식 명시 필수 |
| Churn Rate | 1 − Retention Rate | %. 이탈 판정 기준 명시 |
| CTR | 클릭 ÷ 노출 | % |
| CVR | 전환 ÷ 클릭 (또는 방문) | %. 전환 정의 명시 |
| CPM | 광고비 ÷ 노출 × 1,000 | 통화. 광고 구매 관점 |
| eCPM | 광고 수익 ÷ 노출 × 1,000 | 통화. 광고 판매 관점 |
| CPC | 광고비 ÷ 클릭 | 통화 |
| CPI | 광고비 ÷ 설치 | 통화 |
| CPA | 광고비 ÷ 전환(행동) | 통화 |
| Fill Rate | 노출된 요청 ÷ 광고 요청 | % |
| PUR | PU ÷ AU | % |
| ARPU | 매출 ÷ AU | 통화. 기간 명시 |
| ARPPU | 매출 ÷ PU | 통화. ARPU = ARPPU × PUR |
| ARPDAU | 일 매출 ÷ DAU | 통화 |
| LTV (단순) | ARPU × 평균 생애 기간 | 통화 |
| LTV (이탈률) | ARPU ÷ Churn Rate | 통화 |
| LTV (리텐션 누적) | Σ (Day i Retention × Day i ARPDAU) | 통화. 기간(D90 등) 명시 |
| CAC | 총 획득 비용 ÷ 신규 고객 | 통화 |
| LTV/CAC | LTV ÷ CAC | 배수. 3 이상 권장 |
| ROAS | 광고 기인 매출 ÷ 광고비 | %. 기간(D7, D30) 명시 |
| ROI | (이익 − 투자) ÷ 투자 | %. 이익 기준 |
| Payback Period | CAC를 누적 매출로 회수하는 기간 | 일 · 월 |
| K-factor | 1인당 초대 수 × 초대 전환율 | 배수. 1 초과 시 자가 성장 |
| Engagement Rate (콘텐츠) | (좋아요 + 댓글 + 공유 + 저장) ÷ 조회수 | %. 분모 명시 |
| Completion Rate (VTR) | 완주 조회 ÷ 전체 조회 | % |
| Take Rate | 플랫폼 수수료 ÷ GMV | % |
| Gross Margin | (매출 − COGS) ÷ 매출 | % |
| Burn Rate | 월 현금 지출 − 월 현금 유입 | 통화/월 |
| Runway | 현금 잔고 ÷ Burn Rate | 월 |
| MRR → ARR | MRR × 12 | 통화 |
| NPS | 추천 고객(9~10) % − 비추천 고객(0~6) % | −100 ~ +100 |

## 부록 B. 자주 혼동하는 개념 비교

### Gross Revenue vs Net Revenue

| 구분 | Gross Revenue | Net Revenue |
|---|---|---|
| 의미 | 사용자 결제 총액 | 차감 항목 제외 후 금액 |
| 차감 항목 | 없음 | 플랫폼 수수료, 환불, 세금, (계약에 따라) 운영비 등 |
| 표준 정의 | 비교적 명확 | **계약마다 다름** |
| 주 용도 | 시장 규모, 스토어 순위, 대외 발표 | 정산, 손익, 파트너 분배 |

### AU · DAU · MAU · Stickiness

| 구분 | 기간 | 알려주는 것 |
|---|---|---|
| DAU | 1일 | 일상 습관화, 서버 부하 규모 |
| WAU | 7일 | 주간 패턴, 요일 편차 제거 |
| MAU | 30일 | 서비스 전체 규모 |
| DAU/MAU | 비율 | 월간 사용자가 얼마나 자주 오는가 |

### Retention 산정 방식

| 방식 | D7 판정 기준 | 특징 |
|---|---|---|
| Classic | 7일째 **당일** 활성 | 업계 표준, 보수적, 값이 고정됨 |
| Rolling | 7일째 **또는 이후** 활성 | 값이 크게 나옴, 시간이 지나면 변함 |
| Range | 특정 구간(예: 5~7일) 중 활성 | 주간 · 월간 리텐션에 사용 |

### ROAS vs ROI

| 구분 | ROAS | ROI |
|---|---|---|
| 분자 | 매출 | 이익 |
| 분모 | 광고비 | 총 투자액 |
| 범위 | 캠페인 · 채널 | 사업 · 프로젝트 |
| 100% (또는 1.0) | 광고비 = 매출 (이익은 아직 음수) | 손익 분기 |

### LTV vs ARPU vs ARPPU

| 구분 | 분모 | 기간 |
|---|---|---|
| ARPU | 전체 활성 사용자 | 특정 기간 (일 · 월) |
| ARPPU | 결제 사용자 | 특정 기간 |
| LTV | 사용자 1명 | 전체 생애 (또는 D90 · D365 예측) |

### CPI vs CPA vs CAC

| 구분 | 분자 | 분모 |
|---|---|---|
| CPI | 광고비 | 설치 수 |
| CPA | 광고비 | 정의한 행동(가입, 결제 등) 수 |
| CAC | 광고비 + 인건비 + 도구 등 총 획득 비용 | 신규 고객 수 |

### SEO vs SEM vs ASO

| 구분 | 대상 | 비용 | 성과 시점 |
|---|---|---|---|
| SEO | 웹 검색 엔진 | 무료(콘텐츠 · 기술 투자) | 느림, 지속적 |
| SEM | 웹 검색 엔진 | 유료 광고 | 즉시, 집행 중단 시 소멸 |
| ASO | 앱스토어 | 무료(메타데이터 · 소재 투자) | 중간, 지속적 |

### Long Tail vs Short Tail (Head)

| 구분 | Short Tail (Head) | Long Tail |
|---|---|---|
| 콘텐츠 | 소수 히트 영상, 대형 크리에이터 | 다수 니치 영상, 소규모 크리에이터 |
| 검색 키워드 | 1~2 단어, 검색량 많음, 경쟁 심함 | 3 단어 이상, 검색량 적음, 전환율 높음 |
| 전략 | 규모 · 인지도 확보 | 개인화 추천, 니치 공략, 공급 다양성 |
| 리스크 | 소수 의존도 높음 | 개별 성과 작음, 발견 비용 |

### KPI vs OKR vs North Star Metric

| 구분 | 역할 | 주기 | 개수 |
|---|---|---|---|
| North Star Metric | 제품 가치를 대표하는 단일 지표 | 상시 | 1개 |
| KPI | 상시 모니터링하는 핵심 성과 지표 | 상시 (일 · 주 · 월) | 소수 |
| OKR | 분기 도전 목표와 측정 결과 | 분기 | 목표 3~5개 × KR 2~5개 |

### MVP vs PoC vs Prototype

| 구분 | 목적 | 대상 | 결과물 |
|---|---|---|---|
| PoC | 실현 가능성 확인 | 내부 | 기술 검증, 폐기 가능 |
| Prototype | UX · 흐름 검토 | 내부 · 소수 사용자 | 시안, 실제 코드 아닐 수 있음 |
| MVP | 시장 가설 검증 | 실제 사용자 | 출시 가능한 최소 제품 |

### Attribution vs Incrementality

| 구분 | Attribution | Incrementality |
|---|---|---|
| 질문 | 이 설치는 어떤 광고 덕분인가? | 광고가 없었어도 설치했을까? |
| 방법 | 클릭 · 노출 매칭 | 실험군 · 대조군 비교 |
| 한계 | 자연 유입을 광고 성과로 과대 계상 가능 | 비용 · 기간 소요, 세밀한 채널 분해 어려움 |

### Impression vs Reach vs Frequency

| 구분 | 의미 | 중복 |
|---|---|---|
| Impression | 노출 횟수 | 포함 |
| Reach | 노출된 고유 사용자 수 | 제거 |
| Frequency | Impression ÷ Reach | 1인당 평균 노출 |

### Brand Marketing vs Performance Marketing

| 구분 | Brand | Performance |
|---|---|---|
| 목표 | 인지 · 호감 · 장기 수요 | 설치 · 전환 · 단기 매출 |
| 측정 | Brand Lift, 인지도 조사, SOV | CPI, ROAS, CAC |
| 과금 | CPM 중심 | CPI · CPA · tROAS 중심 |
| 회수 기간 | 길다 | 짧다 |

### Bookings vs Revenue vs Cash

| 구분 | 시점 |
|---|---|
| Bookings | 결제 발생 시점 |
| Revenue | 서비스 제공(회계 인식) 시점 |
| Cash | 스토어 · PG에서 실제 입금된 시점 |

## 부록 C. 사용자 퍼널 단계별 지표 매핑

AARRR 퍼널 기준으로 각 단계의 대표 지표와 담당 영역을 정리한다.

| 단계 | 사용자 행동 | 대표 지표 | 주요 수단 |
|---|---|---|---|
| **Acquisition (획득)** | 광고 · 검색 · 공유 링크를 보고 설치 | Impression, CTR, Store CVR, CPI, Organic 비율 | UA, SEO/ASO, 바이럴, 리퍼럴 |
| **Activation (활성화)** | 첫 세션에서 핵심 가치 경험 | 활성화율, TTV, 온보딩 완료율, D1 Retention | 온보딩, 지연 딥링크, 콜드 스타트 추천 |
| **Retention (유지)** | 반복 방문, 습관화 | D7 · D30 Retention, Stickiness, 세션 빈도, Churn | 추천 품질, 푸시 · CRM, 콘텐츠 공급 |
| **Revenue (수익)** | 광고 시청, 결제, 구독 | ARPDAU, PUR, ARPPU, eCPM, Fill Rate, LTV | IAA 최적화, IAP · 기프팅, 구독 |
| **Referral (추천)** | 공유, 초대 | Share Rate, K-factor, 리퍼럴 전환율 | 공유 기능, 초대 보상, OG 태그 |

### 숏폼 서비스 세부 퍼널 예시

```
광고 노출 → 클릭 → 스토어 페이지 조회 → 설치 → 첫 실행 → 첫 영상 시청
  → 세션 내 N개 시청(활성화) → D1 재방문 → 팔로우 · 좋아요 → D7 재방문
  → 광고 노출 수익 발생 → 코인 구매 → 기프팅 → 외부 공유 → 신규 유입
```

각 화살표 사이의 전환율을 채널 · 국가 · 코호트별로 추적한다.

## 문서 관리 규칙

- 새 용어를 추가할 때는 **정식 명칭 → 약어 → 정의 → 산식(지표인 경우) → 실무 포인트** 순서를 지킨다.
- 지표는 반드시 **분모 · 분자 · 집계 기간 · 집계 단위(기기/계정)** 를 함께 적는다. 산식이 없는 지표 정의는 추가하지 않는다.
- 회사마다 정의가 다른 용어(Net Revenue, Retention 방식, 활성 사용자 기준)는 통상적 의미만 기술하고, 프로젝트 확정 기준은 별도의 프로젝트 지표 정의서에 기록한다.
- 스토어 수수료율, 개인정보 규제, 광고 정책 등 변동이 잦은 내용은 **기준 시점**을 함께 표기하고, 정산 로직 · 법무 검토 시 최신 정책을 재확인한다.
- 프로젝트 내부 전용 축약어가 필요하면 이 문서가 아니라 별도의 프로젝트 용어집에 정의하고, 여기서는 표준 용어만 유지한다.

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
(function () {
  var raw = document.getElementById('src').textContent;
  var doc = document.getElementById('doc');
  var empty = document.getElementById('empty');

  if (typeof marked === 'undefined') {
    var pre = document.createElement('pre');
    pre.style.whiteSpace = 'pre-wrap';
    pre.textContent = raw;
    doc.appendChild(pre);
    return;
  }

  var scratch = document.createElement('div');
  scratch.innerHTML = marked.parse(raw);

  // Group flat markdown output into sections (H2) and term blocks (H3).
  var nodes = Array.prototype.slice.call(scratch.children);
  var sections = [];
  var sec = null, block = null;

  function newBlock(cls, heading) {
    block = document.createElement('div');
    block.className = cls;
    if (heading) block.appendChild(heading);
    if (sec) sec.el.appendChild(block);
    return block;
  }

  nodes.forEach(function (node) {
    if (node.tagName === 'HR') return;
    if (node.tagName === 'H2') {
      var el = document.createElement('section');
      el.className = 'sec';
      var m = node.textContent.match(/^(부록\s+[A-Z]|\d+)\.\s*(.+)$/);
      var h2 = document.createElement('h2');
      if (m) {
        var n = document.createElement('span');
        n.className = 'n';
        n.textContent = m[1];
        h2.appendChild(n);
        h2.appendChild(document.createTextNode(m[2]));
        el.dataset.label = m[1];
        el.dataset.name = m[2];
      } else {
        h2.textContent = node.textContent;
        el.dataset.label = '';
        el.dataset.name = node.textContent;
      }
      el.id = 'sec-' + sections.length;
      el.appendChild(h2);
      var rule = document.createElement('div');
      rule.className = 'rule';
      el.appendChild(rule);
      sec = { el: el, blocks: [] };
      sections.push(sec);
      doc.appendChild(el);
      block = null;
      return;
    }
    if (!sec) return;
    if (node.tagName === 'H3') {
      newBlock('term', node);
      sec.blocks.push(block);
      return;
    }
    if (!block) {
      newBlock('blk', null);
      sec.blocks.push(block);
    }
    if (node.tagName === 'TABLE') {
      var wrap = document.createElement('div');
      wrap.className = 'tw';
      wrap.appendChild(node);
      block.appendChild(wrap);
    } else {
      block.appendChild(node);
    }
  });

  // Sidebar navigation
  var nav = document.getElementById('nav');
  sections.forEach(function (s) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + s.el.id;
    a.innerHTML = '<span class="n"></span><span class="t"></span>';
    a.querySelector('.n').textContent = s.el.dataset.label;
    a.querySelector('.t').textContent = s.el.dataset.name;
    li.appendChild(a);
    nav.appendChild(li);
    s.link = a;
  });

  // Live filter
  var q = document.getElementById('q');
  var hits = document.getElementById('hits');
  var total = document.querySelectorAll('.term').length;

  function filter() {
    var term = q.value.trim().toLowerCase();
    var shown = 0, anySection = false;
    sections.forEach(function (s) {
      var visible = 0;
      s.blocks.forEach(function (b) {
        var match = !term || b.textContent.toLowerCase().indexOf(term) !== -1;
        b.classList.toggle('is-hidden', !match);
        if (match) { visible++; if (b.classList.contains('term')) shown++; }
      });
      s.el.classList.toggle('is-hidden', visible === 0);
      s.link.parentElement.classList.toggle('is-hidden', visible === 0);
      if (visible) anySection = true;
    });
    hits.textContent = term ? shown : total;
    empty.style.display = anySection ? 'none' : 'block';
  }

  q.addEventListener('input', filter);
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; filter(); q.blur(); }
  });

  // Active-section highlight
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          sections.forEach(function (s) { s.link.classList.toggle('on', s.el === en.target); });
        }
      });
    }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
    sections.forEach(function (s) { io.observe(s.el); });
  }
  if (sections[0]) sections[0].link.classList.add('on');
})();
</script>
